<!-- 棋盘颜色设置页面 -->
<div id="boardColorContent" class="p-6 md:p-8 hidden">
    <h2 class="text-2xl font-bold mb-6 text-primary">棋盘颜色设置</h2>

    <div class="bg-white rounded-lg shadow-md p-6">
        <div class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1">线条颜色</label>
                    <div class="flex gap-2 items-center">
                        <input type="color" id="boardLineColor" value="#8B5A2B" class="w-12 h-10 border rounded cursor-pointer">
                        <input type="text" id="boardLineColorText" value="#8B5A2B" class="flex-1 border rounded-lg px-3 py-2" placeholder="#8B5A2B">
                    </div>
                </div>
                <div>
                    <label class="block text-sm mb-1">点颜色</label>
                    <div class="flex gap-2 items-center">
                        <input type="color" id="boardDotColor" value="#8B5A2B" class="w-12 h-10 border rounded cursor-pointer">
                        <input type="text" id="boardDotColorText" value="#8B5A2B" class="flex-1 border rounded-lg px-3 py-2" placeholder="#8B5A2B">
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <label class="block text-sm mb-2">棋盘背景图片</label>
                <div id="backgroundImageGrid" class="grid grid-cols-4 gap-2 max-h-72 overflow-y-auto p-2 bg-gray-50 rounded-lg">
                    <div class="text-gray-500 text-sm text-center py-4 col-span-4">暂无背景图片</div>
                </div>
                <div class="flex gap-2 mt-2 items-center flex-wrap">
                    <button id="loadBackgroundsBtn" class="text-sm text-primary hover:text-primary/80"><i class="fa-solid fa-refresh mr-1"></i>刷新图片列表</button>
                    <label class="text-sm text-blue-600 hover:text-blue-700 cursor-pointer">
                        <i class="fa-solid fa-upload mr-1"></i>上传图片
                        <input type="file" id="uploadBackgroundInput" accept="image/*" class="hidden" onchange="handleBackgroundUpload(this)">
                    </label>
                    <label class="flex items-center text-sm">
                        <input type="checkbox" id="saveUploadToServer" class="mr-1 rounded">
                        <span class="text-gray-600">保存到服务器</span>
                    </label>
                </div>
                <div id="uploadProgress" class="hidden mt-2 text-sm text-primary">
                    <i class="fa-solid fa-spinner fa-spin mr-1"></i>上传中...
                </div>
            </div>
            <div class="flex gap-3 mt-4">
                <button id="saveBoardColorBtn" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg"><i class="fa-solid fa-save mr-1"></i>保存设置</button>
                <button id="resetBoardColorBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg"><i class="fa-solid fa-rotate-left mr-1"></i>恢复默认</button>
            </div>
        </div>
    </div>
</div>
