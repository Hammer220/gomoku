<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - 消息中心</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23C4955A'/%3E%3Cstop offset='100%25' stop-color='%238B5A2B'/%3E%3C/linearGradient%3E%3CradialGradient id='bs' cx='38%25' cy='35%25'%3E%3Cstop offset='0%25' stop-color='%23666'/%3E%3Cstop offset='40%25' stop-color='%23333'/%3E%3Cstop offset='100%25' stop-color='%23111'/%3E%3C/radialGradient%3E%3CradialGradient id='ws' cx='38%25' cy='35%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='50%25' stop-color='%23eee'/%3E%3Cstop offset='100%25' stop-color='%23ccc'/%3E%3C/radialGradient%3E%3Cfilter id='sh'%3E%3CfeDropShadow dx='1' dy='1.5' stdDeviation='1.5' flood-opacity='.35'/%3E%3C/filter%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23bg)'/%3E%3Cg stroke='%23A0724A' stroke-width='.5' opacity='.4'%3E%3Cline x1='14' y1='24' x2='50' y2='24'/%3E%3Cline x1='14' y1='32' x2='50' y2='32'/%3E%3Cline x1='14' y1='40' x2='50' y2='40'/%3E%3Cline x1='24' y1='14' x2='24' y2='50'/%3E%3Cline x1='32' y1='14' x2='32' y2='50'/%3E%3Cline x1='40' y1='14' x2='40' y2='50'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='1.5' fill='%23A0724A' opacity='.5'/%3E%3Ccircle cx='24' cy='24' r='9' fill='url(%23bs)' filter='url(%23sh)'/%3E%3Cellipse cx='21' cy='21' rx='3.5' ry='2.5' fill='%23fff' opacity='.12'/%3E%3Ccircle cx='40' cy='40' r='9' fill='url(%23ws)' filter='url(%23sh)'/%3E%3Cellipse cx='37' cy='37' rx='3' ry='2' fill='%23fff' opacity='.5'/%3E%3C/svg%3E">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative">

    <div id="gameContainer" class="max-w-7xl w-full bg-white rounded-2xl shadow-xl overflow-hidden relative card-3d-hover">
        <div class="header-bar">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gradient">五子棋</h1>
                <p class="text-sm opacity-80">消息中心</p>
            </div>
            <div class="flex items-center space-x-3 md:space-x-6">
                <div class="flex items-center">
                    <div class="avatar-circle mr-2">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div>
                        <p id="userNameDisplay" class="font-semibold"></p>
                        <p class="text-xs">积分: <span id="userScoreDisplay">0</span> · 胜: <span id="userWinsDisplay">0</span></p>
                    </div>
                </div>
                <button id="logoutBtn" class="btn-secondary btn-sm btn-ripple">
                    <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">退出</span>
                </button>
            </div>
        </div>

        <div class="bg-gray-50 border-b flex overflow-x-auto p-2">
            <div class="tab-group">
                <a href="/game" class="tab-btn"><i class="fa-solid fa-chess-board mr-1"></i>游戏大厅</a>
                <a href="/user" class="tab-btn"><i class="fa-solid fa-user mr-1"></i>个人中心</a>
                <span class="tab-btn tab-active"><i class="fa-solid fa-envelope mr-1"></i>消息中心 <span id="unreadBadge" class="bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 ml-1 hidden animate-pulse">0</span></span>
                <a href="/settings" class="tab-btn"><i class="fa-solid fa-gear mr-1"></i>设置</a>
                <a href="/admin" id="adminNavLink" class="tab-btn text-red-600 hidden"><i class="fa-solid fa-crown mr-1"></i>管理后台</a>
            </div>
        </div>

        <div class="p-4 md:p-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div class="tab-group">
                    <button id="inboxTab" class="tab-btn active"><i class="fa-solid fa-inbox mr-1"></i>收件箱</button>
                    <button id="sentTab" class="tab-btn"><i class="fa-solid fa-paper-plane mr-1"></i>已发送</button>
                    <button id="composeTab" class="tab-btn"><i class="fa-solid fa-pen-to-square mr-1"></i>写消息</button>
                </div>
                <div class="flex gap-2">
                    <button id="markAllReadBtn" class="btn-info btn-sm btn-ripple"><i class="fa-solid fa-check-double mr-1"></i>全部标为已读</button>
                    <button id="refreshMessagesBtn" class="btn-secondary btn-sm btn-ripple"><i class="fa-solid fa-refresh mr-1"></i>刷新</button>
                </div>
            </div>

            <div id="inboxPanel">
                <div id="inboxMessages" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                    <div class="text-gray-500 text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
                </div>
            </div>

            <div id="sentPanel" class="hidden">
                <div id="sentMessages" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                    <div class="text-gray-500 text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
                </div>
            </div>

            <div id="composePanel" class="hidden">
                <div class="section-block card-diagonal">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2"><i class="fa-solid fa-user mr-1"></i>收件人</label>
                        <div class="flex flex-wrap gap-2 mb-2">
                            <div class="relative flex-1 min-w-[200px]">
                                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="recipientSearch" placeholder=" " class="w-full border rounded-xl pl-10 pr-3 py-2.5 text-sm input-focus-animate" autocomplete="off">
                            </div>
                        </div>
                        <div id="recipientTags" class="flex flex-wrap gap-1 mb-2"></div>
                        <div id="userSuggestions" class="bg-white border rounded-lg shadow-lg max-h-48 overflow-y-auto hidden"></div>
                        <p id="recipientHint" class="text-xs text-gray-400 mt-1">所有用户均可多选收件人</p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2"><i class="fa-solid fa-comment mr-1"></i>消息内容</label>
                        <textarea id="messageContent" rows="4" placeholder=" " class="w-full border rounded-xl px-3 py-2.5 text-sm input-focus-animate resize-none"></textarea>
                    </div>
                    <button id="sendMessageBtn" class="btn-primary btn-ripple"><i class="fa-solid fa-paper-plane mr-1"></i>发送</button>
                </div>
            </div>

            <div id="messageDetailPanel" class="hidden mt-4">
                <button id="backToListBtn" class="btn-secondary btn-sm btn-ripple mb-3"><i class="fa-solid fa-arrow-left mr-1"></i>返回列表</button>
                <div id="messageDetailContent" class="section-block card-diagonal"></div>
            </div>
        </div>

        <div class="bg-gray-50 p-3 text-center text-sm text-gray-500 border-t">&copy; 2026 五子棋 · 实时状态同步版</div>
    </div>

    {% include 'includes/components.html' %}

    <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/gomoku/core.js"></script>
    <script src="/static/js/gomoku/i18n.js"></script>
    <script src="/static/js/gomoku/utils.js"></script>
    <script src="/static/js/gomoku/websocket_manager.js"></script>
    <script src="/static/js/gomoku/board_render.js"></script>
<script src="/static/js/gomoku/board_rules.js"></script>
    <script src="/static/js/gomoku/game_core.js"></script>
<script src="/static/js/gomoku/game_ui.js"></script>
    <script src="/static/js/gomoku/user.js"></script>
    <script src="/static/js/gomoku/user_management/pagination.js"></script>
<script src="/static/js/gomoku/user_management/users.js"></script>
<script src="/static/js/gomoku/user_management/modals.js"></script>
<script src="/static/js/gomoku/user_management/records_admin.js"></script>
<script src="/static/js/gomoku/user_management.js"></script>
    <script src="/static/js/gomoku/match_monitor.js"></script>
    <script src="/static/js/gomoku/history_stats.js"></script>
    <script src="/static/js/gomoku/replay_canvas.js"></script>
<script src="/static/js/gomoku/replay_controls.js"></script>
    <script src="/static/js/gomoku/background_settings.js"></script>
    <script src="/static/js/gomoku/messages.js"></script>
    <script src="/static/js/gomoku/init_messages.js"></script>
</body>
</html>
