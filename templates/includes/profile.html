<!-- 个人资料页面 -->
<div id="profileContent" class="content-panel hidden">
    <h2 class="section-title"><i class="fa-solid fa-user"></i> 个人资料</h2>
    
    <div class="section-block card-diagonal">
        <div class="section-block-header"><i class="fa-solid fa-id-card"></i> 基本信息</div>
        <div class="profile-info-grid">
            <div class="profile-info-card">
                <div class="profile-info-icon bg-primary/10">
                    <i class="fa-solid fa-user text-primary"></i>
                </div>
                <div>
                    <label class="profile-info-label">用户名</label>
                    <p id="profileUsername" class="profile-info-value">-</p>
                </div>
            </div>
            <div class="profile-info-card">
                <div class="profile-info-icon bg-yellow-50">
                    <i class="fa-solid fa-star text-yellow-500"></i>
                </div>
                <div>
                    <label class="profile-info-label">积分</label>
                    <p id="profileScore" class="profile-info-value text-gradient font-bold">-</p>
                </div>
            </div>
            <div class="profile-info-card">
                <div class="profile-info-icon bg-amber-50">
                    <i class="fa-solid fa-trophy text-amber-500"></i>
                </div>
                <div>
                    <label class="profile-info-label">段位</label>
                    <p id="profileRank" class="profile-info-value">-</p>
                </div>
            </div>
            <div class="profile-info-card">
                <div class="profile-info-icon bg-green-50">
                    <i class="fa-solid fa-hand-fist text-green-500"></i>
                </div>
                <div>
                    <label class="profile-info-label">胜场</label>
                    <p id="profileWins" class="profile-info-value text-green-600">-</p>
                </div>
            </div>
            <div class="profile-info-card">
                <div class="profile-info-icon bg-blue-50">
                    <i class="fa-solid fa-chess-board text-blue-500"></i>
                </div>
                <div>
                    <label class="profile-info-label">对局数</label>
                    <p id="profileGames" class="profile-info-value">-</p>
                </div>
            </div>
            <div class="profile-info-card">
                <div class="profile-info-icon bg-purple-50">
                    <i class="fa-solid fa-calendar text-purple-500"></i>
                </div>
                <div>
                    <label class="profile-info-label">注册日期</label>
                    <p id="profileJoinDate" class="profile-info-value">-</p>
                </div>
            </div>
            <div class="profile-info-card">
                <div class="profile-info-icon bg-sky-50">
                    <i class="fa-solid fa-clock text-sky-500"></i>
                </div>
                <div>
                    <label class="profile-info-label">最后登录</label>
                    <p id="profileLastLogin" class="profile-info-value">-</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="section-block card-diagonal">
        <div class="section-block-header"><i class="fa-solid fa-key"></i> 修改密码</div>
        <div class="space-y-4 max-w-md">
            <div class="float-label-input">
                <input type="password" id="changeOldPassword" placeholder=" " class="w-full px-4 py-2.5 border-2 rounded-xl text-base input-focus-animate">
                <label>旧密码</label>
            </div>
            <div class="float-label-input">
                <input type="password" id="changeNewPassword" placeholder=" " class="w-full px-4 py-2.5 border-2 rounded-xl text-base input-focus-animate">
                <label>新密码（至少6位）</label>
            </div>
            <div class="float-label-input">
                <input type="password" id="changeConfirmPassword" placeholder=" " class="w-full px-4 py-2.5 border-2 rounded-xl text-base input-focus-animate">
                <label>确认新密码</label>
            </div>
            <button id="changePasswordBtn" class="btn-primary btn-ripple">
                <i class="fa-solid fa-key mr-2"></i>修改密码
            </button>
        </div>
    </div>
</div>
