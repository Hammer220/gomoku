<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title data-i18n-title="loginPage">五子棋 - 登录</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        html {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Hiragino Kaku Gothic Pro", "Microsoft YaHei", "Microsoft JhengHei", "Helvetica Neue", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
        }
        input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            outline: none;
            font-size: 16px;
        }
        input:focus {
            border-color: #8B5A2B;
            box-shadow: 0 0 0 3px rgba(139,90,43,0.15);
        }
        button {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        .modal-content {
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        /* ===== Cerberus 风格 PoW 验证卡片 ===== */
        .cerberus-widget {
            width: 100%;
            min-height: 120px;
            margin: 6px 0;
        }
        .cerberus-card {
            background: linear-gradient(145deg, #f4e9d5, #eadfc7);
            border: 1px solid rgba(139,90,43,0.15);
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            font-family: inherit;
        }
        .cerberus-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .cerberus-mascot {
            width: 32px; height: 32px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 22px;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.12));
        }
        .cerberus-title { font-weight: 600; color: #4b2e1a; font-size: 15px; }
        .cerberus-progress-wrap { margin-bottom: 6px; }
        .cerberus-progress {
            height: 8px; background: rgba(0,0,0,0.08);
            border-radius: 999px; overflow: hidden;
        }
        .cerberus-progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #8B5A2B, #c68b4b);
            transition: width 0.25s ease-out;
        }
        .cerberus-meta { font-size: 12px; color: #7a5a3a; margin-top: 6px; }
        .cerberus-meta b { color: #4b2e1a; }
        .cerberus-status { font-size: 12px; color: #5a4a3a; margin-top: 8px; min-height: 16px; }
        .cerberus-retry {
            margin-top: 8px; padding: 4px 10px;
            background: transparent; border: 1px solid #8B5A2B;
            color: #8B5A2B; border-radius: 6px; font-size: 12px;
            cursor: pointer;
        }
        .cerberus-retry:hover { background: rgba(139,90,43,0.1); }
        .cerberus-widget .hidden { display: none !important; }

        /* ===== Cerberus 风格 POW 首页守卫 ===== */
        .pow-guard-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(160deg, #f4e9d5 0%, #eadfc7 50%, #dccda8 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        .pow-guard-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .pow-guard-card {
            background: #fff; border-radius: 20px;
            max-width: 520px; width: 100%;
            padding: 32px 28px 28px;
            box-shadow: 0 18px 50px rgba(139,90,43,0.18), 0 2px 6px rgba(0,0,0,0.04);
            text-align: center;
            border: 1px solid rgba(139,90,43,0.12);
        }
        .pow-guard-mascot {
            width: 72px; height: 72px; margin: 0 auto 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 48px;
            background: linear-gradient(145deg, #f4e9d5, #eadfc7);
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(139,90,43,0.1);
        }
        .pow-guard-title {
            font-size: 18px; font-weight: 700; color: #4b2e1a;
            margin-bottom: 4px;
        }
        .pow-guard-sub {
            font-size: 13px; color: #8a6a4a; margin-bottom: 20px;
        }
        .pow-guard-progress {
            height: 10px; background: #eee4d2;
            border-radius: 999px; overflow: hidden; margin-bottom: 8px;
        }
        .pow-guard-progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #8B5A2B, #c68b4b);
            transition: width 0.25s ease-out;
        }
        .pow-guard-meta {
            font-size: 12px; color: #7a5a3a; margin-bottom: 6px;
        }
        .pow-guard-meta b { color: #4b2e1a; }
        .pow-guard-status {
            font-size: 13px; color: #5a4a3a; min-height: 18px; margin-top: 6px;
        }
        .pow-guard-status.pass { color: #2d7a3a; font-weight: 600; }
        .pow-guard-status.fail { color: #a22; font-weight: 600; }
        .pow-guard-retry {
            margin-top: 14px; padding: 6px 14px;
            background: transparent; border: 1px solid #8B5A2B;
            color: #8B5A2B; border-radius: 8px; font-size: 13px;
            cursor: pointer;
        }
        .pow-guard-retry:hover { background: rgba(139,90,43,0.08); }
        .pow-guard-hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative overflow-x-hidden">

    <!-- Cerberus 风格 POW 首页守卫（大屏整页，通过后才露出登录表单） -->
    <div id="powGuard" class="pow-guard-overlay">
        <div class="pow-guard-card">
            <div class="pow-guard-mascot" aria-hidden="true">🐕</div>
            <div class="pow-guard-title" data-i18n-cerberus-title="CerberusChecking">确保你不是机器人</div>
            <div class="pow-guard-sub" data-i18n-cerberus-sub="CerberusSub">正在进行浏览器检查，仅需几秒钟</div>
            <div class="pow-guard-progress"><div id="pg-bar" class="pow-guard-progress-bar"></div></div>
            <div class="pow-guard-meta">
                <span data-i18n-cerberus-speed="速度">速度</span>: <b id="pg-speed">--</b> kH/s ·
                <span data-i18n-cerberus-diff="难度">难度</span>: <b id="pg-diff">--</b> ·
                <span>已计算: <b id="pg-tried">0</b> 次</span>
            </div>
            <div id="pg-status" class="pow-guard-status" data-i18n-cerberus-initial="正在发起挑战 ...">正在发起挑战 ...</div>
            <button id="pg-retry" type="button" class="pow-guard-retry pow-guard-hidden" data-i18n-cerberus-retry="重新开始">重新开始</button>
        </div>
    </div>

    <!-- 装饰性背景元素 -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-20 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-primary/5 rounded-full blur-3xl"></div>
        <div class="absolute top-1/4 left-1/4 w-2 h-2 bg-primary/30 rounded-full animate-pulse"></div>
        <div class="absolute top-3/4 right-1/4 w-3 h-3 bg-primary/20 rounded-full animate-pulse" style="animation-delay: 0.5s;"></div>
        <div class="absolute top-1/2 right-1/3 w-1.5 h-1.5 bg-primary/25 rounded-full animate-pulse" style="animation-delay: 1s;"></div>
    </div>

    <div class="lang-selector">
        <button id="langBtn" class="lang-btn">
            <span id="currentLangName">简体中文</span>
            <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>
        <div id="langDropdown" class="lang-dropdown">
            <div class="lang-option" data-lang="zh-CN">
                <span class="lang-name">简体中文</span>
            </div>
            <div class="lang-option" data-lang="zh-TW">
                <span class="lang-name">繁體中文</span>
            </div>
            <div class="lang-option" data-lang="en">
                <span class="lang-name">English</span>
            </div>
        </div>
    </div>

    <!-- 登录表单（页面内直接展示，不使用弹出遮罩） -->
    <div id="loginModal" class="w-full max-w-md relative">
        <div class="modal-content bg-white rounded-2xl p-5 sm:p-6 md:p-8 w-full shadow-xl">
            <div class="text-center mb-4">
                <div class="inline-flex items-center justify-center w-14 h-14 mx-auto mb-3 rounded-xl bg-gradient-to-br from-primary/10 to-primary/5">
                    <i class="fa-solid fa-user text-primary text-xl"></i>
                </div>
                <h2 class="text-xl sm:text-2xl font-bold text-center text-primary" data-i18n="loginTitle">登录五子棋</h2>
            </div>
            <form id="loginForm" class="space-y-3 sm:space-y-4">
                <div class="float-label-input">
                    <input type="text" id="username" placeholder="" required autocomplete="username" class="w-full px-4 py-2.5 sm:py-2 border-2 rounded-xl text-base input-focus-animate login-input">
                    <label data-i18n="username">用户名</label>
                </div>
                <div class="float-label-input">
                    <input type="password" id="password" placeholder="" required autocomplete="current-password" class="w-full px-4 py-2.5 sm:py-2 border-2 rounded-xl text-base input-focus-animate login-input">
                    <label data-i18n="password">密码</label>
                </div>
                <div id="geetestLoginWidget" class="geetest-container" style="min-height: 44px;"></div>
                <button type="submit" class="w-full btn-primary btn-ripple py-3 rounded-xl font-medium" data-i18n="loginBtn">登录</button>
                <div id="geetestGuestWidget" class="geetest-container hidden" style="min-height: 44px;"></div>
                <button type="button" id="guestLoginBtn" class="w-full btn-secondary btn-ripple py-3 rounded-xl font-medium"><span data-i18n="guestLogin">访客登录</span></button>
                <p class="text-center text-gray-700 text-sm sm:text-base font-medium"><a href="#" id="showRegister" class="text-primary hover:underline font-semibold" data-i18n="registerNow">立即注册</a></p>
                <p class="text-center text-gray-600 text-sm sm:text-base font-medium"><a href="#" id="showPasswordFreeLogin" class="text-primary hover:underline font-semibold" data-i18n="passwordFreeLogin">免密登录</a></p>
            </form>
        </div>
    </div>

    <div id="registerModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 hidden overflow-y-auto modal-overlay">
        <div class="modal-content bg-white rounded-2xl p-5 sm:p-6 md:p-8 max-w-md w-full mx-3 sm:mx-4 my-4">
            <div class="text-center mb-4">
                <div class="inline-flex items-center justify-center w-14 h-14 mx-auto mb-3 rounded-xl bg-gradient-to-br from-primary/10 to-primary/5">
                    <i class="fa-solid fa-user-plus text-primary text-xl"></i>
                </div>
                <h2 class="text-xl sm:text-2xl font-bold text-center text-primary" data-i18n="registerTitle">注册新账号</h2>
            </div>
            <form id="registerForm" class="space-y-3 sm:space-y-4">
                <div class="float-label-input">
                    <input type="text" id="regUsername" placeholder="" required autocomplete="username" class="w-full px-4 py-2.5 sm:py-2 border-2 rounded-xl text-base input-focus-animate login-input">
                    <label data-i18n="username">用户名</label>
                </div>
                <div class="float-label-input">
                    <input type="password" id="regPassword" placeholder="" required autocomplete="new-password" class="w-full px-4 py-2.5 sm:py-2 border-2 rounded-xl text-base input-focus-animate login-input">
                    <label data-i18n="passwordMinLenPlaceholder">密码(至少6位)</label>
                </div>
                <div class="float-label-input">
                    <input type="password" id="confirmPassword" placeholder="" required autocomplete="new-password" class="w-full px-4 py-2.5 sm:py-2 border-2 rounded-xl text-base input-focus-animate login-input">
                    <label data-i18n="confirmPasswordPlaceholder">确认密码</label>
                </div>
                <div id="geetestRegisterWidget" class="geetest-container" style="min-height: 44px;"></div>
                <button type="submit" class="w-full btn-primary btn-ripple py-3 rounded-xl font-medium" data-i18n="registerBtn">注册</button>
                <p class="text-center text-gray-600 text-sm sm:text-base"><a href="#" id="showLogin" class="text-primary" data-i18n="loginNow">立即登录</a></p>
            </form>
        </div>
    </div>

    <!-- 免密登录 -->
    <div id="passwordFreeLoginPage" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 hidden overflow-y-auto modal-overlay">
        <div class="modal-content bg-white rounded-2xl p-5 sm:p-6 md:p-8 max-w-md w-full mx-3 sm:mx-4 my-4">
            <div class="text-center mb-4">
                <div class="inline-flex items-center justify-center w-14 h-14 mx-auto mb-3 rounded-xl bg-gradient-to-br from-primary/10 to-primary/5">
                    <i class="fa-solid fa-key text-primary text-xl"></i>
                </div>
                <h2 class="text-xl sm:text-2xl font-bold text-center text-primary" data-i18n="passwordFreeTitle">免密登录</h2>
                <p class="text-center text-gray-400 text-xs mt-1" data-i18n="passwordFreeDesc">需管理员开启免密权限后方可使用</p>
            </div>
            <form id="passwordFreeLoginForm" class="space-y-3 sm:space-y-4">
                <div class="float-label-input">
                    <input type="text" id="passwordFreeUsername" placeholder="" required autocomplete="username" class="w-full px-4 py-2.5 sm:py-2 border-2 rounded-xl text-base input-focus-animate login-input">
                    <label data-i18n="enterUsername">请输入用户名</label>
                </div>
                <div id="passwordFreeAttemptsInfo" class="hidden text-center text-sm text-gray-600 bg-gray-100 rounded-lg p-2">
                    <span id="passwordFreeAttemptsText"></span>
                </div>
                <button type="submit" class="w-full btn-primary btn-ripple py-3 rounded-xl font-medium" data-i18n="passwordFreeBtn">免密登录</button>
                <div class="text-center space-y-2">
                    <p class="text-gray-600 text-sm sm:text-base"><a href="#" id="showLoginFromFree" class="text-primary hover:underline font-medium" data-i18n="loginNow">立即登录</a></p>
                    <p class="text-gray-500 text-sm"><a href="#" id="showRegisterFromFree" class="text-primary hover:underline" data-i18n="registerNow">立即注册</a></p>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-4 left-1/2 z-50" style="transform: translateX(-50%); -webkit-transform: translateX(-50%);"></div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/gomoku/core.js"></script>
    <script src="/static/js/gomoku/utils.js"></script>
    <script src="/static/js/gomoku/i18n.js"></script>
    <script src="/static/js/gomoku/websocket_manager.js"></script>
    <script src="/static/js/gomoku/pow.js"></script>
    <script src="/static/js/gomoku/captcha.js"></script>
    <script src="/static/js/gomoku/user.js"></script>
    <script src="/static/js/gomoku/init_login.js"></script>
    <script>
    (function() {
        var floatLabelInputs = document.querySelectorAll('.float-label-input input');
        floatLabelInputs.forEach(function(input) {
            function updateLabelPosition() {
                var parent = input.closest('.float-label-input');
                if (parent) {
                    var label = parent.querySelector('label');
                    if (label) {
                        if (input.value || document.activeElement === input) {
                            label.classList.add('label-floated');
                        } else {
                            label.classList.remove('label-floated');
                        }
                    }
                }
            }
            input.addEventListener('input', updateLabelPosition);
            input.addEventListener('focus', updateLabelPosition);
            input.addEventListener('blur', updateLabelPosition);
            input.addEventListener('propertychange', updateLabelPosition);
            updateLabelPosition();
        });
    })();
    </script>
    <script>
    (function() {
        if (window.location.pathname === '/register') {
            var loginModal = document.getElementById('loginModal');
            var registerModal = document.getElementById('registerModal');
            if (loginModal) loginModal.classList.add('hidden');
            if (registerModal) registerModal.classList.remove('hidden');
            if (Gomoku.captchaEnabled) {
                setTimeout(function() {
                    var regContainer = document.getElementById('geetestRegisterWidget');
                    if (regContainer && !regContainer.hasAttribute('data-initialized') && window.Gomoku) {
                        regContainer.setAttribute('data-initialized', 'true');
                        window.Gomoku.initGeetestWidget('geetestRegisterWidget', function() {});
                    }
                }, 300);
            } else {
                Gomoku.registerGeetestToken = 'disabled';
            }
        }
    })();
    </script>
    <script>
    (function() {
        var langBtn = document.getElementById('langBtn');
        var langDropdown = document.getElementById('langDropdown');
        var currentLangName = document.getElementById('currentLangName');
        var langOptions = document.querySelectorAll('.lang-option');

        var langData = {
            'zh-CN': { name: '简体中文' },
            'zh-TW': { name: '繁體中文' },
            'en': { name: 'English' }
        };

        function updateLangDisplay(lang) {
            var data = langData[lang] || langData['zh-CN'];
            currentLangName.textContent = data.name;
            langOptions.forEach(function(opt) {
                opt.classList.remove('active');
                if (opt.dataset.lang === lang) {
                    opt.classList.add('active');
                }
            });
        }

        function initLangSelector() {
            var savedLang = localStorage.getItem('language') || 'zh-CN';
            updateLangDisplay(savedLang);
        }

        langBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            langDropdown.classList.toggle('show');
        });

        document.addEventListener('click', function() {
            langDropdown.classList.remove('show');
        });

        langOptions.forEach(function(option) {
            option.addEventListener('click', function(e) {
                e.stopPropagation();
                var lang = this.dataset.lang;
                localStorage.setItem('language', lang);
                updateLangDisplay(lang);
                document.documentElement.lang = lang;
                if (window.Gomoku && Gomoku.i18n) {
                    Gomoku.i18n.setLang(lang);
                }
                location.reload();
            });
        });

        initLangSelector();
    })();
    </script>
</body>
</html>
