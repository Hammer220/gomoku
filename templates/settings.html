<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="settingsPage">五子棋 - 设置</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        .lang-option { transition: all 0.3s ease; }
        .lang-option:hover { transform: translateX(5px); }
        .lang-option.selected { background-color: var(--color-primary); color: white; }
        html { scroll-behavior: smooth; }
        #settingsContainer { scroll-behavior: smooth; }
        .section-block:target {
            animation: highlight-section 1s ease-out;
        }
        @keyframes highlight-section {
            0% { background-color: rgba(59, 130, 246, 0.2); }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative">

    <div id="settingsContainer" class="max-w-7xl w-full bg-white rounded-2xl shadow-xl overflow-hidden card-3d-hover">
        <div class="header-bar">
            <div>
                <h1 class="text-2xl font-bold text-white" data-i18n="appName">五子棋</h1>
                <p class="text-sm opacity-80" data-i18n="settingsPage">设置页面</p>
            </div>
            <div class="flex items-center space-x-3 md:space-x-6">
                <div class="flex items-center">
                    <div class="avatar-circle mr-2">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div>
                        <p id="userNameDisplay" class="font-semibold"></p>
                        <p class="text-xs"><span data-i18n="points">积分</span>: <span id="userScoreDisplay">0</span> · <span data-i18n="rank">段位</span>: <span id="userRankDisplay" data-i18n="noRank">无段位</span> · <span data-i18n="wins">胜</span>: <span id="userWinsDisplay">0</span></p>
                    </div>
                </div>
                <button id="logoutBtn" class="btn-secondary btn-sm btn-ripple">
                    <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline" data-i18n="logout">退出</span>
                </button>
                <div id="guestAuthButtons" class="hidden space-x-2">
                    <a href="/login" class="btn-secondary btn-sm"><i class="fa-solid fa-right-to-bracket mr-1"></i><span data-i18n="login">登录</span></a>
                    <a href="/register" class="btn-primary btn-sm"><i class="fa-solid fa-user-plus mr-1"></i><span data-i18n="register">注册</span></a>
                </div>
            </div>
        </div>

        <div class="bg-gray-50 border-b flex overflow-x-auto p-2">
            <div class="tab-group">
                <a href="/game" class="tab-btn"><i class="fa-solid fa-chess-board mr-1"></i><span data-i18n="gameHall">游戏大厅</span></a>
                <a href="/user" id="userCenterLink" class="tab-btn"><i class="fa-solid fa-user mr-1"></i><span data-i18n="userCenter">个人中心</span></a>
                <a href="/messages" id="messagesLink" class="tab-btn"><i class="fa-solid fa-envelope mr-1"></i><span data-i18n="messageCenter">消息中心</span> <span id="unreadBadge" class="bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 ml-1 hidden animate-pulse">0</span></a>
                <span class="tab-btn tab-active"><i class="fa-solid fa-gear mr-1"></i><span data-i18n="settings">设置</span></span>
                <a href="/admin" id="adminNavLink" class="tab-btn text-red-600 hidden"><i class="fa-solid fa-crown mr-1"></i><span data-i18n="adminPanel">管理后台</span></a>
            </div>
        </div>

        <div class="bg-gray-50 border-b flex overflow-x-auto p-2">
            <div class="tab-group">
                <button class="tab-btn active" data-tab="general"><i class="fa-solid fa-gear mr-2"></i><span data-i18n="generalSettings">通用设置</span></button>
                <button class="tab-btn" data-tab="display"><i class="fa-solid fa-palette mr-2"></i><span data-i18n="displaySettings">显示设置</span></button>
            </div>
        </div>

        <div class="p-6">
            <div id="generalTab" class="tab-content">
                <div class="space-y-6">
                    <div id="language-section" class="section-block card-diagonal">
                        <h3 class="section-block-header">
                            <i class="fa-solid fa-language mr-2"></i><span data-i18n="languageSettings">语言设置</span>
                        </h3>
                        <p class="text-gray-600 mb-4" data-i18n="selectLanguage">选择语言</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3" id="languageOptions">
                            <button class="lang-option p-4 border-2 rounded-xl text-center hover-lift card-diagonal" data-lang="zh-CN">
                                <div class="text-2xl mb-1">🇨🇳</div>
                                <div class="font-medium" data-i18n="simplifiedChinese">简体中文</div>
                            </button>
                            <button class="lang-option p-4 border-2 rounded-xl text-center hover-lift card-diagonal" data-lang="zh-TW">
                                <div class="text-2xl mb-1">🇹🇼</div>
                                <div class="font-medium" data-i18n="traditionalChinese">繁體中文</div>
                            </button>
                            <button class="lang-option p-4 border-2 rounded-xl text-center hover-lift card-diagonal" data-lang="en">
                                <div class="text-2xl mb-1">🇺🇸</div>
                                <div class="font-medium" data-i18n="english">English</div>
                            </button>
                        </div>
                    </div>

                    <div id="account-section" class="section-block card-diagonal">
                        <h3 class="section-block-header">
                            <i class="fa-solid fa-user mr-2"></i><span data-i18n="accountSettings">账号设置</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div class="info-card hover-lift">
                                <div class="info-card-label"><i class="fa-solid fa-user info-card-icon mr-2"></i><span data-i18n="username">用户名</span></div>
                                <div id="usernameDisplay" class="info-card-value">-</div>
                            </div>
                            <div class="info-card hover-lift">
                                <div class="info-card-label"><i class="fa-solid fa-star info-card-icon mr-2 text-yellow-500"></i><span data-i18n="points">积分</span></div>
                                <div id="pointsDisplay" class="info-card-value text-gradient font-bold">-</div>
                            </div>
                            <div class="info-card hover-lift">
                                <div class="info-card-label"><i class="fa-solid fa-trophy info-card-icon mr-2 text-amber-500"></i><span data-i18n="wins">胜</span></div>
                                <div id="winsDisplay" class="info-card-value">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="displayTab" class="tab-content hidden">
                <div class="space-y-6">
                    <div id="board-color-section" class="section-block card-diagonal">
                        <h3 class="section-block-header">
                            <i class="fa-solid fa-palette mr-2"></i><span data-i18n="boardColorSettings">棋盘颜色设置</span>
                        </h3>
                        <div class="space-y-4">
                            <div class="flex items-center justify-between p-4 bg-white rounded-xl shadow-sm hover-lift card-3d-hover transition-all duration-300">
                                <label class="text-gray-700 font-medium" data-i18n="lineColor">
                                    <i class="fa-solid fa-lines-leaning mr-2 text-primary"></i>线条颜色
                                </label>
                                <div class="flex items-center gap-3">
                                    <div class="relative">
                                        <input type="color" id="boardLineColor" value="#8B5A2B" class="w-12 h-12 rounded-xl cursor-pointer border-2 border-gray-200 shadow-sm hover:border-primary transition-colors duration-200">
                                    </div>
                                    <input type="text" id="boardLineColorText" value="#8B5A2B" class="w-28 px-3 py-2 border-2 border-gray-200 rounded-xl text-sm input-focus-animate font-mono">
                                </div>
                            </div>
                            <div class="flex items-center justify-between p-4 bg-white rounded-xl shadow-sm hover-lift card-3d-hover transition-all duration-300">
                                <label class="text-gray-700 font-medium" data-i18n="dotColor">
                                    <i class="fa-solid fa-circle-dot mr-2 text-primary"></i>星位颜色
                                </label>
                                <div class="flex items-center gap-3">
                                    <div class="relative">
                                        <input type="color" id="boardDotColor" value="#8B5A2B" class="w-12 h-12 rounded-xl cursor-pointer border-2 border-gray-200 shadow-sm hover:border-primary transition-colors duration-200">
                                    </div>
                                    <input type="text" id="boardDotColorText" value="#8B5A2B" class="w-28 px-3 py-2 border-2 border-gray-200 rounded-xl text-sm input-focus-animate font-mono">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="background-section" class="section-block card-diagonal">
                        <h3 class="section-block-header">
                            <i class="fa-solid fa-image mr-2"></i><span data-i18n="backgroundImage">背景图片</span>
                        </h3>
                        <div id="backgroundImageGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mb-4 max-h-72 overflow-y-auto p-3 bg-gray-50 rounded-xl">
                        </div>
                        <div class="flex gap-2 mt-2 items-center flex-wrap">
                            <label class="btn-secondary btn-sm cursor-pointer">
                                <i class="fa-solid fa-upload mr-1"></i><span data-i18n="uploadImage">上传图片</span>
                                <input type="file" id="uploadBackgroundInput" accept="image/*" class="hidden" onchange="handleBackgroundUpload(this)">
                            </label>
                            <label class="flex items-center text-sm">
                                <input type="checkbox" id="saveUploadToServer" class="mr-1 rounded">
                                <span class="text-gray-600" data-i18n="saveToServer">保存到服务器</span>
                            </label>
                        </div>
                        <div id="uploadProgress" class="hidden mt-2 text-sm text-primary">
                            <i class="fa-solid fa-spinner fa-spin mr-1"></i><span data-i18n="uploading">上传中...</span>
                        </div>
                        <button id="loadBackgroundsBtn" class="btn-secondary btn-ripple w-full mt-3">
                            <i class="fa-solid fa-refresh mr-2"></i><span data-i18n="loadSettings">刷新列表</span>
                        </button>
                    </div>

                    <div class="flex gap-3">
                        <button id="saveBoardColorBtn" class="flex-1 btn-primary btn-ripple">
                            <i class="fa-solid fa-save mr-2"></i><span data-i18n="saveSettings">保存设置</span>
                        </button>
                        <button id="resetBoardColorBtn" class="btn-secondary btn-ripple">
                            <i class="fa-solid fa-rotate-left mr-2"></i><span data-i18n="reset">重置</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-gray-50 p-4 text-center text-sm text-gray-500 border-t">
            <span>&copy; 2026 </span><span data-i18n="appName">五子棋</span><span> · </span><span data-i18n="settingsPage">设置页面</span>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script src="/static/js/gomoku/core.js"></script>
    <script src="/static/js/gomoku/utils.js"></script>
    <script src="/static/js/gomoku/i18n.js"></script>
    <script src="/static/js/gomoku/board_render.js"></script>
    <script src="/static/js/gomoku/background_settings.js"></script>
    <script src="/static/js/gomoku/init/auth.js"></script>
    <script>
    (function() {
        var G = window.Gomoku;
        var i18n = G.i18n;

        function updateLanguageSelection() {
            document.querySelectorAll('.lang-option').forEach(function(btn) {
                btn.classList.remove('selected', 'border-primary');
                if (btn.dataset.lang === i18n.currentLang) {
                    btn.classList.add('selected', 'border-primary');
                } else {
                    btn.classList.add('border-gray-200');
                }
            });
        }

        function showToast(message, type) {
            type = type || 'info';
            var colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500',
                warning: 'bg-yellow-500'
            };
            var toast = document.createElement('div');
            toast.className = 'toast ' + colors[type] + ' text-white px-6 py-3 rounded-lg shadow-lg mb-2';
            toast.textContent = message;
            var container = document.getElementById('toastContainer');
            container.appendChild(toast);
            setTimeout(function() {
                toast.remove();
            }, 3000);
        }

        document.querySelectorAll('.lang-option').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var lang = this.dataset.lang;
                i18n.setLang(lang);
                updateLanguageSelection();
                showToast(i18n.t('settingsSaved'), 'success');
                setTimeout(function() {
                    location.reload();
                }, 500);
            });
        });

        var settingsHashValidTabs = ['general', 'display'];

        function parseHash(hash) {
            var parts = hash.split('/');
            return {
                tab: parts[0] || 'general',
                section: parts[1] || null
            };
        }

        function scrollToSection(sectionId) {
            if (!sectionId) return;
            var section = document.getElementById(sectionId);
            if (section) {
                var container = document.getElementById('settingsContainer');
                var sectionTop = section.offsetTop - 20;
                container.scrollTo({
                    top: sectionTop,
                    behavior: 'smooth'
                });
            }
        }

        window.handleSettingsHashChange = function() {
            var hash = window.location.hash.replace('#', '');
            var parsed = parseHash(hash);
            if (settingsHashValidTabs.indexOf(parsed.tab) !== -1) {
                showSettingsTab(parsed.tab, parsed.section);
            } else {
                showSettingsTab('general', null);
            }
        };

        function showSettingsTab(tabId, sectionId) {
            document.querySelectorAll('.tab-group .tab-btn').forEach(function(b) {
                b.classList.remove('active');
            });
            document.querySelector('.tab-group [data-tab="' + tabId + '"]').classList.add('active');
            document.querySelectorAll('.tab-content').forEach(function(content) {
                content.classList.add('hidden');
            });
            document.getElementById(tabId + 'Tab').classList.remove('hidden');

            var newHash = tabId;
            if (sectionId) {
                newHash = tabId + '/' + sectionId;
            }
            history.replaceState(null, '', '#' + newHash);

            if (sectionId) {
                setTimeout(function() {
                    scrollToSection(sectionId);
                }, 100);
            }
        }

        window.addEventListener('hashchange', handleSettingsHashChange);

        if (window.location.hash) {
            handleSettingsHashChange();
        }

        document.querySelectorAll('.tab-group [data-tab]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                showSettingsTab(this.dataset.tab);
            });
        });

        var lineColorInput = document.getElementById('boardLineColor');
        var lineColorText = document.getElementById('boardLineColorText');
        var dotColorInput = document.getElementById('boardDotColor');
        var dotColorText = document.getElementById('boardDotColorText');

        lineColorInput.addEventListener('input', function() {
            lineColorText.value = this.value;
        });
        lineColorText.addEventListener('input', function() {
            var color = this.value;
            if (/^#[0-9A-Fa-f]{6}$/.test(color)) {
                lineColorInput.value = color;
            }
        });

        dotColorInput.addEventListener('input', function() {
            dotColorText.value = this.value;
        });
        dotColorText.addEventListener('input', function() {
            var color = this.value;
            if (/^#[0-9A-Fa-f]{6}$/.test(color)) {
                dotColorInput.value = color;
            }
        });

        document.getElementById('saveBoardColorBtn').addEventListener('click', function() {
            G.boardLineColor = lineColorInput.value;
            G.boardDotColor = dotColorInput.value;
            localStorage.setItem('boardLineColor', G.boardLineColor);
            localStorage.setItem('boardDotColor', G.boardDotColor);
            if (G.saveBoardColorSettings) {
                G.saveBoardColorSettings();
            }
            showToast(i18n.t('settingsSaved'), 'success');
        });

        document.getElementById('resetBoardColorBtn').addEventListener('click', function() {
            G.boardLineColor = '#8B5A2B';
            G.boardDotColor = '#8B5A2B';
            lineColorInput.value = G.boardLineColor;
            lineColorText.value = G.boardLineColor;
            dotColorInput.value = G.boardDotColor;
            dotColorText.value = G.boardDotColor;
            G.selectedBackground = '';
            G.applyBackground('');
            G.renderBackgroundGrid();
            localStorage.setItem('boardLineColor', G.boardLineColor);
            localStorage.setItem('boardDotColor', G.boardDotColor);
            if (G.saveBoardColorSettings) {
                G.saveBoardColorSettings();
            }
            showToast(i18n.t('defaultSettings'), 'info');
        });

        document.getElementById('loadBackgroundsBtn').addEventListener('click', function() {
            if (G.loadBackgrounds) {
                G.loadBackgrounds();
                showToast(i18n.t('loading'), 'info');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            G.token = '';
            localStorage.removeItem('token');
            location.href = '/login';
        });

        async function initSettings() {
            if (G.token) {
                try {
                    G.currentUser = await G.apiCall('/api/current_user', 'GET', null, true);
                    G.isLoggedIn = true;
                    document.getElementById('usernameDisplay').textContent = G.currentUser.username || '-';
                    document.getElementById('pointsDisplay').textContent = G.currentUser.score || 0;
                    document.getElementById('winsDisplay').textContent = G.currentUser.wins || 0;
                    document.getElementById('userNameDisplay').textContent = G.currentUser.username || '-';
                    document.getElementById('userScoreDisplay').textContent = G.currentUser.score || 0;
                    document.getElementById('userRankDisplay').textContent = G.currentUser.rank || '无段位';
                    document.getElementById('userWinsDisplay').textContent = G.currentUser.wins || 0;
                    document.getElementById('logoutBtn').classList.remove('hidden');
                    document.getElementById('guestAuthButtons').classList.add('hidden');
                    var adminNavLink = document.getElementById('adminNavLink');
                    if (adminNavLink) {
                        if (G.currentUser.isAdmin || G.currentUser.isSuperAdmin) {
                            adminNavLink.classList.remove('hidden');
                        } else {
                            adminNavLink.classList.add('hidden');
                        }
                    }
                    var userCenterLink = document.getElementById('userCenterLink');
                    var messagesLink = document.getElementById('messagesLink');
                    if (userCenterLink) userCenterLink.classList.remove('hidden');
                    if (messagesLink) messagesLink.classList.remove('hidden');
                } catch (e) {
                    G.token = '';
                    localStorage.removeItem('token');
                }
            }
            
            if (!G.token) {
                G.isLoggedIn = false;
                document.getElementById('usernameDisplay').textContent = '访客';
                document.getElementById('pointsDisplay').textContent = '-';
                document.getElementById('winsDisplay').textContent = '-';
                document.getElementById('userNameDisplay').textContent = '访客';
                document.getElementById('userScoreDisplay').textContent = '-';
                document.getElementById('userRankDisplay').textContent = '-';
                document.getElementById('userWinsDisplay').textContent = '-';
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('guestAuthButtons').classList.remove('hidden');
                var userCenterLink = document.getElementById('userCenterLink');
                var messagesLink = document.getElementById('messagesLink');
                var adminNavLink = document.getElementById('adminNavLink');
                if (userCenterLink) userCenterLink.classList.add('hidden');
                if (messagesLink) messagesLink.classList.add('hidden');
                if (adminNavLink) adminNavLink.classList.add('hidden');
            }

            if (G.loadBoardColorSettings) {
                await G.loadBoardColorSettings();
            }
            lineColorInput.value = G.boardLineColor || '#8B5A2B';
            lineColorText.value = G.boardLineColor || '#8B5A2B';
            dotColorInput.value = G.boardDotColor || '#8B5A2B';
            dotColorText.value = G.boardDotColor || '#8B5A2B';

            updateLanguageSelection();

            if (G.loadBackgrounds) {
                G.loadBackgrounds();
            }
        }

        initSettings();

    })();
    </script>
</body>
</html>
