<!-- 胜利弹窗 -->
<div id="winModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 hidden modal-overlay">
    <div class="modal-content bg-white rounded-2xl p-6 max-w-sm w-full mx-4 text-center card-3d-hover">
        <div class="relative">
            <div class="inline-flex items-center justify-center w-20 h-20 mx-auto mb-4 rounded-full bg-yellow-100">
                <i id="winIcon" class="fa-solid fa-trophy text-yellow-500 text-3xl"></i>
            </div>
        </div>
        <h2 id="winnerText" class="text-xl font-bold text-gradient mb-2"></h2>
        <p id="winMessage" class="text-gray-500 mb-4"></p>
        <div class="flex gap-3 mt-4">
            <button id="hideWinModalBtn" class="flex-1 btn-secondary btn-ripple py-3 rounded-xl font-medium">
                <i class="fa-solid fa-eye mr-2"></i>查看棋盘
            </button>
            <button id="newGameBtn" class="flex-1 btn-primary btn-ripple py-3 rounded-xl font-medium">
                <i class="fa-solid fa-rotate-right mr-2"></i>再来一局
            </button>
        </div>
    </div>
</div>
