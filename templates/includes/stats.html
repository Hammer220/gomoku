<div id="statsContent" class="p-6 md:p-8 hidden">
    <h2 class="text-2xl font-bold mb-6 text-primary">数据统计</h2>
    <div class="grid grid-cols-5 gap-3 mb-6">
        <div class="bg-white rounded-lg shadow-md p-3 text-center">
            <p class="text-xl font-bold text-primary" id="statTotalGames">0</p>
            <p class="text-sm text-gray-500">总场次</p>
        </div>
        <div class="bg-white rounded-lg shadow-md p-3 text-center">
            <p class="text-xl font-bold text-green-600" id="statWins">0</p>
            <p class="text-sm text-gray-500">胜场</p>
        </div>
        <div class="bg-white rounded-lg shadow-md p-3 text-center">
            <p class="text-xl font-bold text-red-600" id="statLosses">0</p>
            <p class="text-sm text-gray-500">负场</p>
        </div>
        <div class="bg-white rounded-lg shadow-md p-3 text-center">
            <p class="text-xl font-bold text-yellow-600" id="statDraws">0</p>
            <p class="text-sm text-gray-500">平局</p>
        </div>
        <div class="bg-white rounded-lg shadow-md p-3 text-center">
            <p class="text-xl font-bold text-blue-600" id="statWinRate">0%</p>
            <p class="text-sm text-gray-500">胜率</p>
        </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-lg shadow-md p-4">
            <h3 class="text-lg font-semibold mb-3 text-gray-700">胜负分布</h3>
            <div class="relative" style="height: 260px;">
                <canvas id="statPieChart"></canvas>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow-md p-4">
            <h3 class="text-lg font-semibold mb-3 text-gray-700">各模式统计</h3>
            <div class="relative" style="height: 260px;">
                <canvas id="statModeChart"></canvas>
            </div>
        </div>
    </div>
</div>
