<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>五子棋 - 登录</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        html {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }
        input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            outline: none;
            font-size: 16px;
        }
        input:focus {
            border-color: #8B5A2B;
            box-shadow: 0 0 0 3px rgba(139,90,43,0.15);
        }
        button {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        .modal-content {
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative">

    

    <div class="lang-selector">
        <button id="langBtn" class="lang-btn">
            <span id="currentLangName">简体中文</span>
            <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>
        <div id="langDropdown" class="lang-dropdown">
            <div class="lang-option" data-lang="zh-CN">
                <span class="lang-name">简体中文</span>
            </div>
            <div class="lang-option" data-lang="zh-TW">
                <span class="lang-name">繁體中文</span>
            </div>
            <div class="lang-option" data-lang="en">
                <span class="lang-name">English</span>
            </div>
        </div>
    </div>

    <div class="text-center mb-6 md:mb-8">
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-primary mb-2" data-i18n="gameTitle">五子棋</h1>
        <p class="text-gray-600 text-sm sm:text-base md:text-lg" data-i18n="gameSubtitle">经典对弈 · 双人/人机/联机</p>
    </div>

    <!-- 登录/注册模态框 -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 overflow-y-auto modal-overlay">
        <div class="modal-content bg-white rounded-xl p-5 sm:p-6 md:p-8 max-w-md w-full mx-3 sm:mx-4 my-4">
            <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-6 text-center text-primary" data-i18n="loginTitle">登录五子棋</h2>
            <form id="loginForm" class="space-y-3 sm:space-y-4">
                <input type="text" id="username" data-i18n-placeholder="username" placeholder="用户名" required autocomplete="username" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                <input type="password" id="password" data-i18n-placeholder="password" placeholder="密码" required autocomplete="current-password" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                <div id="geetestLoginWidget" class="w-full h-12 border rounded cursor-pointer bg-gray-100 flex items-center justify-center text-sm text-gray-500"></div>
                <button type="submit" class="w-full bg-primary hover:bg-primary/90 active:bg-primary/80 text-white py-3 rounded-lg font-medium transition-colors" data-i18n="loginBtn">登录</button>
                <button type="button" id="guestLoginBtn" class="w-full bg-gray-500 hover:bg-gray-600 active:bg-gray-700 text-white py-3 rounded-lg font-medium"><span data-i18n="guestLogin">访客登录</span></button>
                <p class="text-center text-gray-600 text-sm sm:text-base"><span data-i18n="noAccount">没有账号</span> <a href="#" id="showRegister" class="text-primary" data-i18n="registerNow">立即注册</a></p>
                <p class="text-center text-gray-500 text-sm"><a href="#" id="showPasswordFreeLogin" class="text-primary hover:underline" data-i18n="passwordFreeLogin">免密登录</a></p>
            </form>
        </div>
    </div>

    <div id="registerModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden overflow-y-auto modal-overlay">
        <div class="modal-content bg-white rounded-xl p-5 sm:p-6 md:p-8 max-w-md w-full mx-3 sm:mx-4 my-4">
            <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-6 text-center text-primary" data-i18n="registerTitle">注册新账号</h2>
            <form id="registerForm" class="space-y-3 sm:space-y-4">
                <input type="text" id="regUsername" data-i18n-placeholder="username" placeholder="用户名" required autocomplete="username" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                <input type="password" id="regPassword" data-i18n-placeholder="passwordMinLenPlaceholder" placeholder="密码(至少6位)" required autocomplete="new-password" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                <input type="password" id="confirmPassword" data-i18n-placeholder="confirmPassword" placeholder="确认密码" required autocomplete="new-password" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                <div id="geetestRegisterWidget" class="w-full h-12 border rounded cursor-pointer bg-gray-100 flex items-center justify-center text-sm text-gray-500"></div>
                <button type="submit" class="w-full bg-primary hover:bg-primary/90 active:bg-primary/80 text-white py-3 rounded-lg font-medium transition-colors" data-i18n="registerBtn">注册</button>
                <p class="text-center text-gray-600 text-sm sm:text-base"><span data-i18n="hasAccount">已有账号</span>? <a href="#" id="showLogin" class="text-primary" data-i18n="loginNow">立即登录</a></p>
            </form>
        </div>
    </div>

    <!-- 免密登录 -->
    <div id="passwordFreeLoginPage" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden overflow-y-auto modal-overlay">
        <div class="modal-content bg-white rounded-xl p-5 sm:p-6 md:p-8 max-w-md w-full mx-3 sm:mx-4 my-4">
            <h2 class="text-xl sm:text-2xl font-bold mb-2 text-center text-primary" data-i18n="passwordFreeTitle">免密登录</h2>
            <p class="text-center text-gray-400 text-xs mb-4 sm:mb-6" data-i18n="passwordFreeDesc">需管理员开启免密权限后方可使用</p>
            <form id="passwordFreeLoginForm" class="space-y-3 sm:space-y-4">
                <div>
                    <input type="text" id="passwordFreeUsername" data-i18n-placeholder="enterUsername" placeholder="请输入用户名" required autocomplete="username" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                </div>
                <div id="passwordFreeAttemptsInfo" class="hidden text-center text-sm text-gray-600 bg-gray-100 rounded-lg p-2">
                    <span id="passwordFreeAttemptsText"></span>
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-primary/90 active:bg-primary/80 text-white py-3 rounded-lg font-medium transition-colors" data-i18n="passwordFreeBtn">免密登录</button>
                <div class="text-center space-y-2">
                    <p class="text-gray-600 text-sm sm:text-base"><span data-i18n="normalLogin">普通登录</span>? <a href="#" id="showLoginFromFree" class="text-primary hover:underline font-medium" data-i18n="loginNow">立即登录</a></p>
                    <p class="text-gray-500 text-sm"><span data-i18n="noAccount">没有账号</span> <a href="#" id="showRegisterFromFree" class="text-primary hover:underline" data-i18n="registerNow">立即注册</a></p>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-4 left-1/2 z-50" style="transform: translateX(-50%); -webkit-transform: translateX(-50%);"></div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/gomoku/core.js"></script>
    <script src="/static/js/gomoku/i18n.js"></script>
    <script src="/static/js/gomoku/utils.js"></script>
    <script src="/static/js/gomoku/websocket_manager.js"></script>
    <script src="/static/js/gomoku/captcha.js"></script>
    <script src="/static/js/gomoku/user.js"></script>
    <script src="/static/js/gomoku/init_login.js"></script>
    <script>
    (function() {
        if (window.location.pathname === '/register') {
            var loginModal = document.getElementById('loginModal');
            var registerModal = document.getElementById('registerModal');
            if (loginModal) loginModal.classList.add('hidden');
            if (registerModal) registerModal.classList.remove('hidden');
            setTimeout(function() {
                var regContainer = document.getElementById('geetestRegisterWidget');
                if (regContainer && !regContainer.hasAttribute('data-initialized') && window.Gomoku) {
                    regContainer.setAttribute('data-initialized', 'true');
                    window.Gomoku.initGeetestWidget('geetestRegisterWidget', function() {});
                }
            }, 300);
        }
    })();
    </script>
    <script>
    (function() {
        var langBtn = document.getElementById('langBtn');
        var langDropdown = document.getElementById('langDropdown');
        var currentLangName = document.getElementById('currentLangName');
        var langOptions = document.querySelectorAll('.lang-option');

        var langData = {
            'zh-CN': { name: '简体中文' },
            'zh-TW': { name: '繁體中文' },
            'en': { name: 'English' }
        };

        function updateLangDisplay(lang) {
            var data = langData[lang] || langData['zh-CN'];
            currentLangName.textContent = data.name;
            langOptions.forEach(function(opt) {
                opt.classList.remove('active');
                if (opt.dataset.lang === lang) {
                    opt.classList.add('active');
                }
            });
        }

        function initLangSelector() {
            var savedLang = localStorage.getItem('language') || 'zh-CN';
            updateLangDisplay(savedLang);
        }

        langBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            langDropdown.classList.toggle('show');
        });

        document.addEventListener('click', function() {
            langDropdown.classList.remove('show');
        });

        langOptions.forEach(function(option) {
            option.addEventListener('click', function(e) {
                e.stopPropagation();
                var lang = this.dataset.lang;
                localStorage.setItem('language', lang);
                updateLangDisplay(lang);
                document.documentElement.lang = lang;
                if (window.Gomoku && Gomoku.i18n) {
                    Gomoku.i18n.setLang(lang);
                }
                location.reload();
            });
        });

        initLangSelector();
    })();
    </script>
</body>
</html>
