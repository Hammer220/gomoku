<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - 消息中心</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .bg-primary { background-color: #8B5A2B; }
        .text-primary { color: #8B5A2B; }
        .border-primary { border-color: #8B5A2B; }
        .tab-active { border-bottom: 3px solid #8B5A2B; color: #8B5A2B; font-weight: 600; }
        .toast { animation: fadeIn 0.3s, fadeOut 0.3s 2.7s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; } }
        .btn-hover { transition: all 0.2s ease; }
        .btn-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .message-unread { border-left: 3px solid #8B5A2B; background-color: #fdf6ec; }
        .message-read { border-left: 3px solid transparent; }
        .recipient-tag { display: inline-flex; align-items: center; background: #e8d5b7; color: #5a3a1a; border-radius: 9999px; padding: 2px 10px; font-size: 0.8rem; margin: 2px; }
        .recipient-tag .remove-tag { margin-left: 4px; cursor: pointer; opacity: 0.6; }
        .recipient-tag .remove-tag:hover { opacity: 1; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative">

    <style>
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%238b5a2b' fill-opacity='0.05' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='1'/%3E%3Ccircle cx='13' cy='13' r='1'/%3E%3C/g%3E%3C/svg%3E");
            z-index: -1;
        }
    </style>

    <div id="gameContainer" class="max-w-7xl w-full bg-white rounded-2xl shadow-xl overflow-hidden relative">
        <div class="bg-primary text-white p-4 md:p-6 flex flex-wrap justify-between items-center">
            <div><h1 class="text-2xl md:text-3xl font-bold">五子棋</h1><p class="text-sm opacity-80">消息中心</p></div>
            <div class="flex items-center space-x-3 md:space-x-6">
                <div class="flex items-center"><i class="fa-solid fa-user-circle text-2xl mr-2"></i><div><p id="userNameDisplay" class="font-semibold"></p><p class="text-xs">积分: <span id="userScoreDisplay">0</span> · 胜: <span id="userWinsDisplay">0</span></p></div></div>
                <button id="logoutBtn" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg"><i class="fa-solid fa-right-from-bracket"></i> 退出</button>
            </div>
        </div>

        <div class="bg-gray-50 border-b flex overflow-x-auto">
            <a href="/game" class="px-4 md:px-6 py-3 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap">游戏大厅</a>
            <a href="/user" class="px-4 md:px-6 py-3 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap">个人中心</a>
            <span class="tab-active px-4 md:px-6 py-3 font-medium whitespace-nowrap">消息中心 <span id="unreadBadge" class="bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 ml-1 hidden">0</span></span>
            <a href="/settings" class="px-4 md:px-6 py-3 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap"><i class="fa-solid fa-gear mr-1"></i>设置</a>
            <a href="/admin" id="adminNavLink" class="px-4 md:px-6 py-3 font-medium text-red-600 hover:text-red-800 whitespace-nowrap hidden">管理后台</a>
        </div>

        <div class="p-4 md:p-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div class="flex gap-2">
                    <button id="inboxTab" class="tab-active px-4 py-2 font-medium whitespace-nowrap">收件箱</button>
                    <button id="sentTab" class="px-4 py-2 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap">已发送</button>
                    <button id="composeTab" class="px-4 py-2 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap"><i class="fa-solid fa-pen-to-square mr-1"></i>写消息</button>
                </div>
                <div class="flex gap-2">
                    <button id="markAllReadBtn" class="text-sm bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-check-double mr-1"></i>全部标为已读</button>
                    <button id="refreshMessagesBtn" class="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-refresh mr-1"></i>刷新</button>
                </div>
            </div>

            <div id="inboxPanel">
                <div id="inboxMessages" class="space-y-2 max-h-[500px] overflow-y-auto">
                    <div class="text-gray-500 text-center py-8">加载中...</div>
                </div>
            </div>

            <div id="sentPanel" class="hidden">
                <div id="sentMessages" class="space-y-2 max-h-[500px] overflow-y-auto">
                    <div class="text-gray-500 text-center py-8">加载中...</div>
                </div>
            </div>

            <div id="composePanel" class="hidden">
                <div class="bg-gray-50 rounded-lg p-4">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">收件人</label>
                        <div class="flex flex-wrap gap-2 mb-2">
                            <div class="relative flex-1 min-w-[200px]">
                                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="recipientSearch" placeholder="搜索用户名或输入用户名..." class="w-full border rounded-lg pl-10 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" autocomplete="off">
                            </div>
                        </div>
                        <div id="recipientTags" class="flex flex-wrap gap-1 mb-2"></div>
                        <div id="userSuggestions" class="bg-white border rounded-lg shadow-lg max-h-48 overflow-y-auto hidden"></div>
                        <p id="recipientHint" class="text-xs text-gray-400 mt-1">所有用户均可多选收件人</p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">消息内容</label>
                        <textarea id="messageContent" rows="4" placeholder="请输入消息内容..." class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"></textarea>
                    </div>
                    <button id="sendMessageBtn" class="bg-primary hover:bg-primary/90 text-white px-6 py-2 rounded-lg font-medium"><i class="fa-solid fa-paper-plane mr-1"></i>发送</button>
                </div>
            </div>

            <div id="messageDetailPanel" class="hidden mt-4">
                <button id="backToListBtn" class="text-sm text-primary hover:underline mb-3 inline-block"><i class="fa-solid fa-arrow-left mr-1"></i>返回列表</button>
                <div id="messageDetailContent" class="bg-gray-50 rounded-lg p-4"></div>
            </div>
        </div>

        <div class="bg-gray-50 p-3 text-center text-sm text-gray-500 border-t">&copy; 2026 五子棋 · 实时状态同步版</div>
    </div>

    {% include 'includes/components.html' %}

    <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/gomoku/core.js"></script>
    <script src="/static/js/gomoku/i18n.js"></script>
    <script src="/static/js/gomoku/utils.js"></script>
    <script src="/static/js/gomoku/websocket_manager.js"></script>
    <script src="/static/js/gomoku/board_render.js"></script>
<script src="/static/js/gomoku/board_rules.js"></script>
    <script src="/static/js/gomoku/game_core.js"></script>
<script src="/static/js/gomoku/game_ui.js"></script>
    <script src="/static/js/gomoku/user.js"></script>
    <script src="/static/js/gomoku/user_management/pagination.js"></script>
<script src="/static/js/gomoku/user_management/users.js"></script>
<script src="/static/js/gomoku/user_management/modals.js"></script>
<script src="/static/js/gomoku/user_management/records_admin.js"></script>
<script src="/static/js/gomoku/user_management.js"></script>
    <script src="/static/js/gomoku/match_monitor.js"></script>
    <script src="/static/js/gomoku/history_stats.js"></script>
    <script src="/static/js/gomoku/replay_canvas.js"></script>
<script src="/static/js/gomoku/replay_controls.js"></script>
    <script src="/static/js/gomoku/background_settings.js"></script>
    <script src="/static/js/gomoku/messages.js"></script>
    <script src="/static/js/gomoku/init_messages.js"></script>
</body>
</html>
