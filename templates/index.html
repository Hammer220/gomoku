<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .board-grid {
            background-size: 100% 100%;
            background-image: linear-gradient(to right, rgba(0,0,0,0.6) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0,0,0,0.6) 1px, transparent 1px);
        }
        .piece-shadow { filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07)) drop-shadow(0 2px 2px rgb(0 0 0 / 0.06)); }
        .btn-hover { transition: all 0.2s ease; }
        .btn-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .tab-active { border-bottom: 3px solid #8B5A2B; color: #8B5A2B; font-weight: 600; }
        .toast { animation: fadeIn 0.3s, fadeOut 0.3s 2.7s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; } }
        .piece-animate { animation: bounceIn 0.3s ease-out; }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .bg-primary { background-color: #8B5A2B; }
        .replay-step-active { background-color: #fef3c7; border-left: 3px solid #f59e0b; }
        .text-primary { color: #8B5A2B; }
        .border-primary { border-color: #8B5A2B; }
        .bg-board {
            background-color: #E6C8A0;
            background-image: none;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .saved-game-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        #disconnectOverlay:not(.hidden) { animation: overlayFadeIn 0.3s ease-out; }
        @keyframes overlayFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative">

    <style>
        body::before {
            content: "";
            position: fixed;
            top: 0;

            z-index: -1;
        }
    </style>
