<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="messagesPage">五子棋 - 消息中心</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative">

    <div id="gameContainer" class="max-w-7xl w-full bg-white rounded-2xl shadow-xl overflow-hidden relative card-3d-hover">
        <div class="header-bar">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-white" data-i18n="appName">五子棋</h1>
                <p class="text-sm opacity-80" data-i18n="messagesPage">消息中心</p>
            </div>
            <div class="flex items-center space-x-3 md:space-x-6">
                <div class="flex items-center">
                    <div class="avatar-circle mr-2">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div>
                        <p id="userNameDisplay" class="font-semibold"></p>
                        <p class="text-xs"><span data-i18n="points">积分</span>: <span id="userScoreDisplay">0</span> · <span data-i18n="rank">段位</span>: <span id="userRankDisplay" data-i18n="noRank">无段位</span> · <span data-i18n="wins">胜</span>: <span id="userWinsDisplay">0</span></p>
                    </div>
                </div>
                <button id="logoutBtn" class="btn-secondary btn-sm btn-ripple">
                    <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline" data-i18n="logout">退出</span>
                </button>
            </div>
        </div>

        <div class="bg-gray-50 border-b flex overflow-x-auto p-2">
            <div class="tab-group">
                <a href="/game" class="tab-btn"><i class="fa-solid fa-chess-board mr-1"></i><span data-i18n="gameHall">游戏大厅</span></a>
                <a href="/user" class="tab-btn"><i class="fa-solid fa-user mr-1"></i><span data-i18n="userCenter">个人中心</span></a>
                <span class="tab-btn tab-active"><i class="fa-solid fa-envelope mr-1"></i><span data-i18n="messageCenter">消息中心</span> <span id="unreadBadge" class="bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 ml-1 hidden animate-pulse">0</span></span>
                <a href="/settings" class="tab-btn"><i class="fa-solid fa-gear mr-1"></i><span data-i18n="settings">设置</span></a>
                <a href="/admin" id="adminNavLink" class="tab-btn text-red-600 hidden"><i class="fa-solid fa-crown mr-1"></i><span data-i18n="adminPanel">管理后台</span></a>
            </div>
        </div>

        <div class="p-4 md:p-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div class="tab-group">
                    <button id="inboxTab" class="tab-btn active"><i class="fa-solid fa-inbox mr-1"></i><span data-i18n="inbox">收件箱</span></button>
                    <button id="sentTab" class="tab-btn"><i class="fa-solid fa-paper-plane mr-1"></i><span data-i18n="sent">已发送</span></button>
                    <button id="composeTab" class="tab-btn"><i class="fa-solid fa-pen-to-square mr-1"></i><span data-i18n="compose">写消息</span></button>
                </div>
                <div class="flex gap-2">
                    <button id="markAllReadBtn" class="btn-info btn-sm btn-ripple"><i class="fa-solid fa-check-double mr-1"></i><span data-i18n="markAllRead">全部标为已读</span></button>
                    <button id="refreshMessagesBtn" class="btn-secondary btn-sm btn-ripple"><i class="fa-solid fa-refresh mr-1"></i><span data-i18n="refresh">刷新</span></button>
                </div>
            </div>

            <div id="inboxPanel">
                <div id="inboxMessages" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                    <div class="text-gray-500 text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
                </div>
            </div>

            <div id="sentPanel" class="hidden">
                <div id="sentMessages" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                    <div class="text-gray-500 text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
                </div>
            </div>

            <div id="composePanel" class="hidden">
                <div class="section-block card-diagonal">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2"><i class="fa-solid fa-user mr-1"></i>收件人</label>
                        <div class="flex flex-wrap gap-2 mb-2">
                            <div class="relative flex-1 min-w-[200px]">
                                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 z-10 pointer-events-none"></i>
                                <input type="text" id="recipientSearch" placeholder=" " class="w-full border rounded-xl pl-10 pr-3 py-2.5 text-sm input-focus-animate" autocomplete="off">
                            </div>
                        </div>
                        <div id="recipientTags" class="flex flex-wrap gap-1 mb-2"></div>
                        <div id="userSuggestions" class="bg-white border rounded-lg shadow-lg max-h-48 overflow-y-auto hidden"></div>
                        <p id="recipientHint" class="text-xs text-gray-400 mt-1" data-i18n="multiRecipientHint">所有用户均可多选收件人</p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2"><i class="fa-solid fa-comment mr-1"></i><span data-i18n="messageContent">消息内容</span></label>
                        <textarea id="messageContent" rows="4" placeholder=" " class="w-full border rounded-xl px-3 py-2.5 text-sm input-focus-animate resize-none"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2"><i class="fa-solid fa-image mr-1"></i>图片（可选）</label>
                        <div class="flex items-center gap-2">
                            <button type="button" id="selectImageBtn" class="btn-secondary btn-sm btn-ripple"><i class="fa-solid fa-upload mr-1"></i>选择图片</button>
                            <input type="file" id="imageFileInput" accept="image/*" class="hidden">
                            <span class="text-xs text-gray-400">支持 JPG、PNG、GIF，自动压缩，最大 10MB</span>
                        </div>
                        <div id="imagePreviewContainer" class="mt-2 hidden">
                            <div class="relative inline-block">
                                <img id="imagePreview" src="" alt="预览" class="max-w-[200px] max-h-[200px] rounded-lg border object-cover">
                                <button type="button" id="removeImageBtn" class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full text-xs flex items-center justify-center hover:bg-red-600 transition-colors">&times;</button>
                            </div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2"><i class="fa-solid fa-gift mr-1"></i>积分红包（可选）</label>
                        <div class="flex items-center gap-2 flex-wrap">
                            <button type="button" id="toggleRedPacketBtn" class="btn-secondary btn-sm btn-ripple"><i class="fa-solid fa-gift mr-1"></i>发红包</button>
                            <span class="text-xs text-gray-400">向收件人发送积分红包</span>
                        </div>
                        <div id="redPacketConfig" class="mt-2 p-3 bg-red-50 border border-red-200 rounded-lg hidden">
                            <div class="flex items-center gap-3 flex-wrap">
                                <div>
                                    <label class="text-xs text-gray-600">积分数量</label>
                                    <input type="number" id="redPacketAmount" min="1" value="10" class="w-24 border rounded-lg px-2 py-1 text-sm ml-1">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-600">红包个数</label>
                                    <input type="number" id="redPacketCount" min="1" value="1" class="w-20 border rounded-lg px-2 py-1 text-sm ml-1">
                                </div>
                                <button type="button" id="cancelRedPacketBtn" class="text-xs text-red-500 hover:text-red-700">取消</button>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">红包积分将从您的账户中扣除，每个收件人可领取一个红包</p>
                        </div>
                    </div>
                    <button id="sendMessageBtn" class="btn-primary btn-ripple"><i class="fa-solid fa-paper-plane mr-1"></i><span data-i18n="send">发送</span></button>
                </div>
            </div>

            <div id="messageDetailPanel" class="hidden mt-4">
                <button id="backToListBtn" class="btn-secondary btn-sm btn-ripple mb-3"><i class="fa-solid fa-arrow-left mr-1"></i><span data-i18n="backToList">返回列表</span></button>
                <div id="messageDetailContent" class="section-block card-diagonal"></div>
            </div>
        </div>

        <div class="bg-gray-50 p-3 text-center text-sm text-gray-500 border-t">&copy; 2026 <span data-i18n="appName">五子棋</span> · <span data-i18n="messagesPage">消息中心</span></div>
    </div>

    {% include 'includes/components.html' %}

    <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/gomoku/core.js"></script>
    <script src="/static/js/gomoku/utils.js"></script>
    <script src="/static/js/gomoku/i18n.js"></script>
    <script src="/static/js/gomoku/websocket_manager.js"></script>
    <script src="/static/js/gomoku/board_render.js"></script>
<script src="/static/js/gomoku/board_rules.js"></script>
    <script src="/static/js/gomoku/game_core.js"></script>
<script src="/static/js/gomoku/game_ui.js"></script>
    <script src="/static/js/gomoku/user.js"></script>
    <script src="/static/js/gomoku/user_management/pagination.js"></script>
<script src="/static/js/gomoku/user_management/users.js"></script>
<script src="/static/js/gomoku/user_management/modals.js"></script>
<script src="/static/js/gomoku/user_management/records_admin.js"></script>
<script src="/static/js/gomoku/user_management.js"></script>
    <script src="/static/js/gomoku/match_monitor.js"></script>
    <script src="/static/js/gomoku/history_stats.js"></script>
    <script src="/static/js/gomoku/replay_canvas.js"></script>
<script src="/static/js/gomoku/replay_controls.js"></script>
    <script src="/static/js/gomoku/background_settings.js"></script>
    <script src="/static/js/gomoku/messages.js"></script>
    <script src="/static/js/gomoku/init_messages.js"></script>
</body>
</html>
