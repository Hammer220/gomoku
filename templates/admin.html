<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="adminPage">五子棋 - 管理后台</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative">

    <div id="gameContainer" class="max-w-7xl w-full bg-white rounded-2xl shadow-xl overflow-hidden relative card-3d-hover">
        <div class="header-bar">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-white" data-i18n="appName">五子棋</h1>
                <p class="text-sm" data-i18n="adminPage">管理后台</p>
            </div>
            <div class="flex items-center space-x-3 md:space-x-6">
                <div class="flex items-center">
                    <div class="avatar-circle mr-2">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <p id="userNameDisplay" class="font-semibold"></p>
                        <p class="text-xs text-red-500"><i class="fa-solid fa-crown mr-1"></i><span data-i18n="admin">管理员</span></p>
                    </div>
                </div>
                <button id="logoutBtn" class="btn-secondary btn-sm btn-ripple">
                    <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline" data-i18n="logout">退出</span>
                </button>
            </div>
        </div>

        <div class="bg-gray-50 border-b flex overflow-x-auto p-2">
            <div class="tab-group">
                <a href="/game" class="tab-btn"><i class="fa-solid fa-chess-board mr-1"></i><span data-i18n="gameHall">游戏大厅</span></a>
                <a href="/user" class="tab-btn"><i class="fa-solid fa-user mr-1"></i><span data-i18n="userCenter">个人中心</span></a>
                <a href="/messages" class="tab-btn"><i class="fa-solid fa-envelope mr-1"></i><span data-i18n="messageCenter">消息中心</span></a>
                <a href="/settings" class="tab-btn"><i class="fa-solid fa-gear mr-1"></i><span data-i18n="settings">设置</span></a>
                <span class="tab-btn tab-active"><i class="fa-solid fa-crown mr-1"></i><span data-i18n="adminPanel">管理后台</span></span>
            </div>
        </div>

        {% include 'includes/admin.html' %}

        <div class="bg-gray-50 p-3 text-center text-sm text-gray-500 border-t">&copy; 2026 <span data-i18n="appName">五子棋</span> · <span data-i18n="adminPage">管理后台</span></div>
    </div>

    {% include 'includes/components.html' %}

    {% include 'includes/modals.html' %}

    <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/gomoku/core.js"></script>
    <script src="/static/js/gomoku/utils.js"></script>
    <script src="/static/js/gomoku/i18n.js"></script>
    <script src="/static/js/gomoku/websocket_manager.js"></script>
    <script src="/static/js/gomoku/board_render.js"></script>
<script src="/static/js/gomoku/board_rules.js"></script>
    <script src="/static/js/gomoku/game_core.js"></script>
<script src="/static/js/gomoku/game_ui.js"></script>
    <script src="/static/js/gomoku/user.js"></script>
    <script src="/static/js/gomoku/messages.js"></script>
    <script src="/static/js/gomoku/user_management/pagination.js"></script>
<script src="/static/js/gomoku/user_management/users.js"></script>
<script src="/static/js/gomoku/user_management/modals.js"></script>
<script src="/static/js/gomoku/user_management/records_admin.js"></script>
<script src="/static/js/gomoku/user_management.js"></script>
    <script src="/static/js/gomoku/match_monitor.js"></script>
    <script src="/static/js/gomoku/history_stats.js"></script>
    <script src="/static/js/gomoku/replay_canvas.js"></script>
<script src="/static/js/gomoku/replay_controls.js"></script>
    <script src="/static/js/gomoku/background_settings.js"></script>
    <script src="/static/js/gomoku/init_admin.js"></script>
</body>
</html>
