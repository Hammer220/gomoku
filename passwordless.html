<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免密登录 - 五子棋</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5A2B',
                        secondary: '#D2B48C',
                        board: '#DEB887',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'scale-in': 'scaleIn 0.3s ease-in-out',
                        'bounce-in': 'bounceIn 0.5s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 }
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.95)', opacity: 0 },
                            '100%': { transform: 'scale(1)', opacity: 1 }
                        },
                        bounceIn: {
                            '0%': { transform: 'scale(0.8)', opacity: 0 },
                            '50%': { transform: 'scale(1.1)', opacity: 1 },
                            '100%': { transform: 'scale(1)', opacity: 1 }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .btn-hover {
            transition: all 0.2s ease;
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .modal-content {
            animation: scaleIn 0.3s ease-in-out;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <!-- 登录卡片 -->
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- 头部 -->
            <div class="bg-primary text-white p-8 text-center">
                <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-chess text-4xl"></i>
                </div>
                <h1 class="text-3xl font-bold mb-2">五子棋</h1>
                <p class="text-secondary text-sm">免密登录 · 即开即玩</p>
            </div>
            
            <!-- 登录表单 -->
            <div class="p-8">
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fa-solid fa-user mr-2 text-primary"></i>用户名
                        </label>
                        <div class="relative">
                            <input 
                                type="text" 
                                id="username" 
                                placeholder="请输入用户名" 
                                required
                                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
                                maxlength="20"
                            >
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm" id="charCount">0/20</span>
                        </div>
                        <p class="mt-2 text-xs text-gray-500">
                            <i class="fa-solid fa-info-circle mr-1"></i>
                            新用户名将自动创建账号，无需注册
                        </p>
                    </div>
                    
                    <button 
                        type="submit" 
                        class="w-full bg-primary hover:bg-primary/90 text-white py-4 rounded-xl font-semibold text-lg btn-hover flex items-center justify-center"
                    >
                        <i class="fa-solid fa-right-to-bracket mr-2"></i>
                        立即登录
                    </button>
                </form>
                
                <!-- 分割线 -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-500">其他方式</span>
                    </div>
                </div>
                
                <!-- 其他登录方式 -->
                <div class="space-y-3">
                    <a 
                        href="/" 
                        class="w-full flex items-center justify-center py-3 px-4 border-2 border-gray-200 rounded-xl text-gray-700 hover:border-primary hover:text-primary transition-all btn-hover"
                    >
                        <i class="fa-solid fa-key mr-2"></i>
                        使用密码登录
                    </a>
                </div>
            </div>
            
            <!-- 底部提示 -->
            <div class="bg-gray-50 px-8 py-4 text-center">
                <p class="text-xs text-gray-500">
                    <i class="fa-solid fa-shield-halved mr-1"></i>
                    您的游戏数据将自动保存在本地
                </p>
            </div>
        </div>
        
        <!-- 版权信息 -->
        <p class="text-center text-gray-500 text-sm mt-6">
            © 2025 五子棋游戏 · 免密登录
        </p>
    </div>
    
    <!-- 加载遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl p-8 text-center modal-content">
            <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-gray-700 font-medium" id="loadingText">登录中...</p>
        </div>
    </div>
    
    <!-- Toast提示 -->
    <div id="toastContainer" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script>
        // 工具函数
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast px-6 py-3 rounded-xl shadow-lg mb-2 fade-in ${
                isError ? 'bg-red-100 text-red-800 border border-red-200' : 'bg-green-100 text-green-800 border border-green-200'
            }`;
            toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'} mr-2"></i>${message}`;
            document.getElementById('toastContainer').appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        function showLoading(text = '登录中...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }
        
        // 字数统计
        const usernameInput = document.getElementById('username');
        const charCount = document.getElementById('charCount');
        
        usernameInput.addEventListener('input', () => {
            charCount.textContent = `${usernameInput.value.length}/20`;
        });
        
        // 登录逻辑
        async function passwordlessLogin(username) {
            const response = await fetch('/api/passwordless_login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username }),
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error || '登录失败');
            }
            
            return data;
        }
        
        // 表单提交
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            
            if (!username) {
                showToast('请输入用户名', true);
                return;
            }
            
            if (username.length < 2) {
                showToast('用户名至少2个字符', true);
                return;
            }
            
            showLoading('正在登录...');
            
            try {
                const result = await passwordlessLogin(username);
                
                // 保存token
                localStorage.setItem('token', result.token);
                
                if (result.is_new) {
                    showToast(`欢迎新玩家 ${username}！账号已自动创建`);
                } else {
                    showToast(`欢迎回来，${username}！`);
                }
                
                // 跳转到游戏页面
                setTimeout(() => {
                    window.location.href = '/';
                }, 800);
                
            } catch (error) {
                hideLoading();
                showToast(error.message, true);
            }
        });
        
        // 自动聚焦
        usernameInput.focus();
        
        // 回车快捷登录
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
