<div id="leaderboardContent" class="content-panel hidden">
    <div class="leaderboard-header-enhanced">
        <div>
            <h2 class="section-title"><i class="fa-solid fa-trophy"></i> 积分排行榜</h2>
            <p class="text-gray-500 text-sm">按积分从高到低排序，实时更新</p>
        </div>
        <button id="refreshLeaderboardBtn" class="btn-info btn-sm btn-ripple">
            <i class="fa-solid fa-refresh mr-1"></i>刷新
        </button>
    </div>

    <div id="leaderboardPodium" class="leaderboard-podium hidden">
        <div class="podium-container">
            <div class="podium-item podium-silver">
                <div class="podium-avatar">🥈</div>
                <div class="podium-name" id="podiumName2">-</div>
                <div class="podium-score" id="podiumScore2">-</div>
                <div class="podium-bar second"></div>
            </div>
            <div class="podium-item podium-gold">
                <div class="podium-crown">👑</div>
                <div class="podium-avatar">🥇</div>
                <div class="podium-name" id="podiumName1">-</div>
                <div class="podium-score" id="podiumScore1">-</div>
                <div class="podium-bar first"></div>
            </div>
            <div class="podium-item podium-bronze">
                <div class="podium-avatar">🥉</div>
                <div class="podium-name" id="podiumName3">-</div>
                <div class="podium-score" id="podiumScore3">-</div>
                <div class="podium-bar third"></div>
            </div>
        </div>
    </div>

    <div class="section-block card-diagonal">
        <div class="table-responsive">
            <table class="data-table data-table-striped min-w-full table-rounded table-zebra-hover">
                <thead>
                    <tr>
                        <th class="w-16 text-center">排名</th>
                        <th>用户名</th>
                        <th>段位</th>
                        <th class="text-right">积分</th>
                        <th class="text-right">胜场</th>
                        <th class="text-right">对局数</th>
                        <th>注册日期</th>
                    </tr>
                </thead>
                <tbody id="leaderboardTable"></tbody>
            </table>
        </div>
        <div id="leaderboardEmpty" class="empty-state hidden">
            <i class="fa-solid fa-inbox text-4xl mb-2"></i>
            <p>暂无排行数据</p>
        </div>
    </div>
</div>
