<!-- 联机对战页面 -->
<div id="onlineContent" class="p-4 md:p-6 flex flex-col lg:flex-row gap-6 hidden">
    <div class="flex-1">
        <div class="aspect-square bg-board rounded-lg shadow-lg board-grid relative">
            <canvas id="onlineCanvas" class="w-full h-full cursor-pointer relative" style="z-index: 2;"></canvas>
        </div>
        <div id="onlineGameStatus" class="mt-4 p-3 bg-amber-50 rounded-lg text-center border border-amber-200">
            <p id="onlineStatusText" class="text-lg font-medium">等待加入房间...</p>
            <div class="flex justify-center gap-4 mt-2 text-sm">
                <span>步数: <span id="onlineMoveCount">0</span></span>
                <span>时间: <span id="onlineGameTimeDisplay">00:00</span></span>
                <span>房间号: <span id="onlineMatchIdDisplay">-</span></span>
            </div>
        </div>
    </div>
    <div class="w-full lg:w-80 space-y-4">
        <div class="bg-white rounded-lg shadow-md p-4">
            <h3 class="font-semibold mb-3">房间信息</h3>
            <div id="roomInfo" class="space-y-2 text-sm">
                <p class="text-gray-500">未加入房间</p>
            </div>
            <div id="roomActions" class="mt-3 space-y-2 hidden">
                <button id="closeRoomBtn" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg text-sm">关闭房间</button>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow-md p-4">
            <h3 class="font-semibold mb-3">房间大厅</h3>
            <button id="onlineCreateBtn" class="w-full bg-primary hover:bg-primary/90 text-white py-2 rounded-lg mb-3">创建房间</button>
            <div class="flex gap-2 mb-3">
                <input type="text" id="onlineMatchIdInput" placeholder="输入房间号" class="flex-1 px-3 py-2 border rounded-lg text-sm">
                <button id="onlineJoinBtn" class="px-4 bg-primary hover:bg-primary/90 text-white py-2 rounded-lg text-sm">加入</button>
            </div>
            <div class="border-t pt-3">
                <h4 class="text-sm font-medium mb-2">可用房间</h4>
                <div id="onlineAvailableMatches" class="max-h-48 overflow-y-auto space-y-2"></div>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow-md p-4">
            <button id="onlineLeaveBtn" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg">离开房间</button>
        </div>
    </div>
</div>
