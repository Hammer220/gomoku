<!-- 登录/注册模态框 -->
<div id="loginModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden modal-overlay">
    <div class="modal-content bg-white rounded-xl p-8 max-w-md w-full mx-4">
        <h2 class="text-2xl font-bold mb-6 text-center text-primary">登录五子棋</h2>
        <form id="loginForm" class="space-y-4">
            <input type="text" id="username" placeholder="用户名" required class="form-input">
            <input type="password" id="password" placeholder="密码" required class="form-input">
            <div id="geetestLoginWidget" class="w-full h-12 border rounded cursor-pointer bg-gray-100 flex items-center justify-center text-sm text-gray-500"></div>
            <button type="submit" class="btn-primary w-full py-3">登录</button>
            <button type="button" id="guestLoginBtn" class="btn-secondary w-full py-3">访客登录（剩余<span id="guestRemainingDisplay">5</span>次）</button>
            <p class="text-center text-xs text-gray-400 mt-1" id="guestUsernameHint">随机账号: <span id="guestRandomUsername"></span></p>
            <p class="text-center text-gray-600">没有账号? <a href="#" id="showRegister" class="text-primary font-medium">立即注册</a></p>
            <p class="text-center text-gray-500 text-sm"><a href="#" id="showPasswordFreeLogin" class="text-primary hover:underline">免密登录</a></p>
        </form>
    </div>
</div>

<div id="registerModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden modal-overlay">
    <div class="modal-content bg-white rounded-xl p-8 max-w-md w-full mx-4">
        <h2 class="text-2xl font-bold mb-6 text-center text-primary">注册新账号</h2>
        <form id="registerForm" class="space-y-4">
            <input type="text" id="regUsername" placeholder="用户名" required class="form-input">
            <input type="password" id="regPassword" placeholder="密码(至少6位)" required class="form-input">
            <input type="password" id="confirmPassword" placeholder="确认密码" required class="form-input">
            <div id="geetestRegisterWidget" class="w-full h-12 border rounded cursor-pointer bg-gray-100 flex items-center justify-center text-sm text-gray-500"></div>
            <button type="submit" class="btn-primary w-full py-3">注册</button>
            <p class="text-center text-gray-600">已有账号? <a href="#" id="showLogin" class="text-primary font-medium">立即登录</a></p>
        </form>
    </div>
</div>

<!-- 免密登录页面 -->
<div id="passwordFreeLoginPage" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden modal-overlay">
    <div class="modal-content bg-white rounded-xl p-8 max-w-md w-full mx-4">
        <h2 class="text-2xl font-bold mb-2 text-center text-primary">免密登录</h2>
        <p class="text-center text-gray-400 text-xs mb-6">需管理员开启免密权限后方可使用</p>
        <form id="passwordFreeLoginForm" class="space-y-4">
            <div>
                <input type="text" id="passwordFreeUsername" placeholder="请输入用户名" required class="form-input">
            </div>
            <div id="passwordFreeAttemptsInfo" class="hidden text-center text-sm text-gray-600 bg-gray-100 rounded-lg p-2">
                <span id="passwordFreeAttemptsText"></span>
            </div>
            <button type="submit" class="btn-primary w-full py-3">免密登录</button>
            <div class="text-center space-y-2">
                <p class="text-gray-600">普通登录? <a href="#" id="showLoginFromFree" class="text-primary hover:underline font-medium">立即登录</a></p>
                <p class="text-gray-500 text-sm">没有账号? <a href="#" id="showRegisterFromFree" class="text-primary hover:underline">立即注册</a></p>
            </div>
        </form>
    </div>
</div>

<!-- 联机对战弹窗 -->
<div id="onlineModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden modal-overlay">
    <div class="modal-content bg-white rounded-xl p-6 max-w-lg w-full mx-4">
        <h2 class="text-2xl font-bold mb-6 text-center text-primary">联机对战</h2>
        <div class="space-y-4">
            <button id="createMatchBtn" class="btn-primary w-full py-3">创建房间</button>
            <div class="relative">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t"></div></div>
                <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-gray-500">或</span></div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="matchIdInput" placeholder="输入房间号" class="form-input flex-1">
                <button id="joinMatchBtn" class="btn-primary btn-sm">加入</button>
            </div>
            <div class="relative">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t"></div></div>
                <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-gray-500">可用房间</span></div>
            </div>
            <div id="availableMatches" class="room-list"></div>
        </div>
        <p class="text-center mt-4"><button id="closeOnlineModal" class="btn-ghost text-sm">关闭</button></p>
    </div>
</div>

<!-- 所有游戏记录弹窗 -->
<div id="allRecordsModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden modal-overlay">
    <div class="bg-white rounded-xl p-6 max-w-3xl w-full mx-4 max-h-[80vh] flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-primary">所有游戏记录</h2>
            <button id="closeAllRecordsBtn" class="btn-ghost btn-sm text-xl">&times;</button>
        </div>
        <div class="mb-4">
            <label class="form-label">筛选用户</label>
            <select id="recordsUserFilter" class="form-select">
                <option value="">所有用户</option>
            </select>
        </div>
        <div id="allRecordsContent" class="flex-1 overflow-y-auto">
            <div class="text-gray-500 text-center py-4">加载中...</div>
        </div>
        <div class="mt-4 pt-4 border-t">
            <button id="exportRecordsBtn" class="btn-success btn-sm">
                <i class="fa-solid fa-download mr-1"></i>导出记录
            </button>
        </div>
    </div>
</div>

<!-- 棋局复盘弹窗 -->
<div id="replayModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden modal-overlay">
    <div class="bg-white rounded-xl p-6 max-w-4xl w-full mx-4 max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-primary">棋局复盘</h2>
            <button id="closeReplayBtn" class="btn-ghost btn-sm text-xl">&times;</button>
        </div>
        <div id="replayInfo" class="mb-3 text-sm text-gray-600"></div>
        <div class="flex flex-row gap-4 flex-1 overflow-auto">
            <div class="flex justify-center items-start" style="width: 450px; flex-shrink: 0;">
                <div class="bg-board rounded-lg shadow-lg board-grid relative aspect-square w-full">
                    <canvas id="replayCanvas" class="w-full h-full relative" style="z-index: 2;"></canvas>
                </div>
            </div>
            <div class="flex-1 flex flex-col min-w-0">
                <div class="text-xs text-gray-500 mb-2">点击步骤跳转</div>
                <div id="replayMoveList" class="flex-1 overflow-y-auto border rounded-lg p-2 bg-gray-50 text-sm">
                    <div class="text-gray-400 text-center py-4">加载中...</div>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-center gap-3 mt-4 flex-wrap">
            <button id="replayPrevBtn" class="btn-secondary btn-sm"><i class="fa-solid fa-backward mr-1"></i>上一步</button>
            <span id="replayStepInfo" class="text-sm font-medium min-w-[80px] text-center">第 0/0 步</span>
            <button id="replayNextBtn" class="btn-secondary btn-sm">下一步<i class="fa-solid fa-forward ml-1"></i></button>
            <button id="replayAutoBtn" class="btn-info btn-sm"><i class="fa-solid fa-play mr-1"></i>自动播放</button>
            <button id="replayResetBtn" class="btn-secondary btn-sm"><i class="fa-solid fa-rotate-left mr-1"></i>重置</button>
        </div>
        <div class="flex items-center justify-center gap-3 mt-2">
            <button id="replayLineBtn" class="btn-info btn-sm"><i class="fa-solid fa-magnifying-glass mr-1"></i>显示连线</button>
            <span id="replayLineInfo" class="text-sm font-medium text-gray-700"></span>
        </div>
        <div class="flex items-center justify-center gap-3 mt-2">
            <div class="flex items-center gap-2">
                <label class="text-sm text-gray-600">速度:</label>
                <input type="range" id="replaySpeedSlider" min="1" max="10" value="5" class="w-24">
                <span id="replaySpeedLabel" class="text-xs text-gray-500">0.5s</span>
            </div>
            <span class="text-xs text-gray-400">键盘: ← → 上一步/下一步</span>
        </div>
    </div>
</div>
