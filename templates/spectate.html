<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - 观战</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23C4955A'/%3E%3Cstop offset='100%25' stop-color='%238B5A2B'/%3E%3C/linearGradient%3E%3CradialGradient id='bs' cx='38%25' cy='35%25'%3E%3Cstop offset='0%25' stop-color='%23666'/%3E%3Cstop offset='40%25' stop-color='%23333'/%3E%3Cstop offset='100%25' stop-color='%23111'/%3E%3C/radialGradient%3E%3CradialGradient id='ws' cx='38%25' cy='35%25'%3E%3Cstop offset='0%25' stop-color='%23fff'/%3E%3Cstop offset='50%25' stop-color='%23eee'/%3E%3Cstop offset='100%25' stop-color='%23ccc'/%3E%3C/radialGradient%3E%3Cfilter id='sh'%3E%3CfeDropShadow dx='1' dy='1.5' stdDeviation='1.5' flood-opacity='.35'/%3E%3C/filter%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23bg)'/%3E%3Cg stroke='%23A0724A' stroke-width='.5' opacity='.4'%3E%3Cline x1='14' y1='24' x2='50' y2='24'/%3E%3Cline x1='14' y1='32' x2='50' y2='32'/%3E%3Cline x1='14' y1='40' x2='50' y2='40'/%3E%3Cline x1='24' y1='14' x2='24' y2='50'/%3E%3Cline x1='32' y1='14' x2='32' y2='50'/%3E%3Cline x1='40' y1='14' x2='40' y2='50'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='1.5' fill='%23A0724A' opacity='.5'/%3E%3Ccircle cx='24' cy='24' r='9' fill='url(%23bs)' filter='url(%23sh)'/%3E%3Cellipse cx='21' cy='21' rx='3.5' ry='2.5' fill='%23fff' opacity='.12'/%3E%3Ccircle cx='40' cy='40' r='9' fill='url(%23ws)' filter='url(%23sh)'/%3E%3Cellipse cx='37' cy='37' rx='3' ry='2' fill='%23fff' opacity='.5'/%3E%3C/svg%3E">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed">

    <div id="spectateContainer" class="max-w-lg w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="header-bar">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-white">五子棋</h1>
                <p class="text-sm opacity-80">观战模式</p>
            </div>
            <div class="flex items-center space-x-3">
                <a href="/game" class="btn-secondary btn-sm btn-ripple">
                    <i class="fa-solid fa-chess-board mr-1"></i>进入游戏
                </a>
            </div>
        </div>

        <div class="p-4">
            <!-- 对局信息 -->
            <div id="spectateHeader" class="text-center mb-3">
                <p class="text-gray-600 text-sm">正在加载...</p>
            </div>

            <!-- 棋盘 -->
            <div class="aspect-square bg-board rounded-lg shadow-lg relative mb-3">
                <canvas id="spectateCanvas" class="w-full h-full" style="z-index: 2;"></canvas>
            </div>

            <!-- 状态栏 -->
            <div class="bg-gray-50 rounded-lg p-3 text-sm">
                <div class="flex justify-between items-center">
                    <span><i class="fa-solid fa-list-numbered mr-1"></i>步数: <span id="moveCount">0</span></span>
                    <span class="text-gray-500">房间: <span id="roomId" class="font-mono font-bold"></span></span>
                    <span id="gameStatus" class="text-gray-500">观战中...</span>
                </div>
            </div>

            <!-- 错误遮罩 -->
            <div id="spectateError" class="hidden mt-4 p-4 bg-red-50 rounded-lg text-center">
                <i class="fa-solid fa-exclamation-circle text-red-500 text-2xl mb-2"></i>
                <p id="spectateErrorMsg" class="text-red-600 text-sm"></p>
                <a href="/game" class="inline-block mt-3 btn-primary btn-ripple py-2 px-4 rounded-lg text-sm">
                    <i class="fa-solid fa-arrow-left mr-2"></i>返回游戏大厅
                </a>
            </div>
        </div>

        <div class="bg-gray-50 p-3 text-center text-sm text-gray-500 border-t">&copy; 2026 五子棋 · 观战模式</div>
    </div>

    <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script src="/static/js/gomoku/spectate_page.js"></script>
</body>
</html>
