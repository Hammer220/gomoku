<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - 游戏大厅</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative">

    <div id="gameContainer" class="max-w-7xl w-full bg-white rounded-2xl shadow-xl overflow-hidden relative">
        <div class="header-bar">
            <div><h1 class="text-2xl md:text-3xl font-bold">五子棋</h1><p class="text-sm opacity-80">游戏大厅</p></div>
            <div class="flex items-center space-x-3 md:space-x-6">
                <div class="flex items-center"><i class="fa-solid fa-user-circle text-2xl mr-2"></i><div><p id="userNameDisplay" class="font-semibold"></p><p class="text-xs">积分: <span id="userScoreDisplay">0</span> · 胜: <span id="userWinsDisplay">0</span></p></div></div>
                <button id="logoutBtn" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg"><i class="fa-solid fa-right-from-bracket"></i> 退出</button>
                <div id="guestAuthButtons" class="hidden space-x-2">
                    <a href="/login" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg"><i class="fa-solid fa-right-to-bracket"></i> 登录</a>
                    <a href="/register" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg"><i class="fa-solid fa-user-plus"></i> 注册</a>
                </div>
            </div>
        </div>

        <div class="bg-gray-50 border-b flex overflow-x-auto">
            <span class="tab-active px-4 md:px-6 py-3 font-medium whitespace-nowrap">游戏大厅</span>
            <a href="/user" id="userCenterLink" class="px-4 md:px-6 py-3 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap">个人中心</a>
            <a href="/messages" id="messagesLink" class="px-4 md:px-6 py-3 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap">消息中心 <span id="unreadBadge" class="bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 ml-1 hidden">0</span></a>
            <a href="/settings" id="settingsLink" class="px-4 md:px-6 py-3 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap"><i class="fa-solid fa-gear mr-1"></i>设置</a>
            <a href="/admin" id="adminNavLink" class="px-4 md:px-6 py-3 font-medium text-red-600 hover:text-red-800 whitespace-nowrap hidden">管理后台</a>
        </div>

        <div class="bg-gray-50 border-b flex overflow-x-auto">
            <button id="gameTab" class="tab-active px-4 md:px-6 py-3 font-medium whitespace-nowrap">本地对局</button>
            <button id="onlineTab" class="px-4 md:px-6 py-3 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap">联机对战</button>
        </div>

        <div id="guestBanner" class="hidden bg-yellow-100 border-b border-yellow-300 p-3 text-center">
            <p class="text-sm text-yellow-800"><i class="fa-solid fa-info-circle mr-1"></i>访客账号: <span id="guestDisplayUsername"></span> · 剩余游戏次数: <span id="guestRemainingGames">5</span> 次 · <a href="/login" class="underline font-medium">注册账号</a> 以保存记录</p>
        </div>

        {% include 'includes/modals.html' %}

        {% include 'includes/game_content.html' %}

        {% include 'includes/online.html' %}

        <div id="disconnectOverlay" class="absolute inset-0 bg-black/60 flex items-center justify-center z-40 hidden modal-overlay">
            <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center shadow-2xl">
                <div class="text-5xl mb-4 text-red-500"><i class="fa-solid fa-exclamation-triangle"></i></div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">服务器连接已断开</h3>
                <p class="text-gray-500 mb-6">服务器已关闭，请稍后刷新页面重试</p>
                <button onclick="location.reload()" class="bg-primary text-white px-6 py-3 rounded-lg font-medium hover:bg-primary-dark transition-colors">
                    <i class="fa-solid fa-rotate mr-2"></i>刷新页面
                </button>
            </div>
        </div>

        <div class="bg-gray-50 p-3 text-center text-sm text-gray-500 border-t">&copy; 2026 五子棋 · 实时状态同步版</div>
    </div>

    {% include 'includes/components.html' %}

    <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/gomoku/core.js"></script>
    <script src="/static/js/gomoku/i18n.js"></script>
    <script src="/static/js/gomoku/utils.js"></script>
    <script src="/static/js/gomoku/websocket_manager.js"></script>
    <script src="/static/js/gomoku/board_render.js"></script>
<script src="/static/js/gomoku/board_rules.js"></script>
    <script src="/static/js/gomoku/ai.js"></script>
    <script src="/static/js/gomoku/captcha.js"></script>
    <script src="/static/js/gomoku/user.js"></script>
    <script src="/static/js/gomoku/user_management/pagination.js"></script>
<script src="/static/js/gomoku/user_management/users.js"></script>
<script src="/static/js/gomoku/user_management/modals.js"></script>
<script src="/static/js/gomoku/user_management/records_admin.js"></script>
<script src="/static/js/gomoku/user_management.js"></script>
    <script src="/static/js/gomoku/match_monitor.js"></script>
    <script src="/static/js/gomoku/history_stats.js"></script>
    <script src="/static/js/gomoku/replay_canvas.js"></script>
<script src="/static/js/gomoku/replay_controls.js"></script>
    <script src="/static/js/gomoku/background_settings.js"></script>
    <script src="/static/js/gomoku/game_core.js"></script>
<script src="/static/js/gomoku/game_ui.js"></script>
    <script src="/static/js/gomoku/messages.js"></script>
    <script src="/static/js/gomoku/online/room_list.js"></script>
<script src="/static/js/gomoku/online/room_actions.js"></script>
<script src="/static/js/gomoku/online/polling.js"></script>
<script src="/static/js/gomoku/online/timer.js"></script>
<script src="/static/js/gomoku/online/interactions.js"></script>
<script src="/static/js/gomoku/online/room_chat.js"></script>
<script src="/static/js/gomoku/online.js"></script>
    <script src="/static/js/gomoku/init_game/settings.js"></script>
    <script src="/static/js/gomoku/init_game/modes.js"></script>
    <script src="/static/js/gomoku/init_game/actions.js"></script>
    <script src="/static/js/gomoku/init_game/admin.js"></script>
    <script src="/static/js/gomoku/init_game/admin_match.js"></script>
</body>
</html>
