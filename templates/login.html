<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>五子棋 - 登录</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        html {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }
        .bg-primary { background-color: #8B5A2B; }
        .text-primary { color: #8B5A2B; }
        .border-primary { border-color: #8B5A2B; }
        .toast {
            -webkit-animation: fadeIn 0.3s, fadeOut 0.3s 2.7s forwards;
            animation: fadeIn 0.3s, fadeOut 0.3s 2.7s forwards;
        }
        @-webkit-keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @-webkit-keyframes fadeOut { to { opacity: 0; } }
        @keyframes fadeOut { to { opacity: 0; } }
        input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            outline: none;
            font-size: 16px;
        }
        input:focus {
            border-color: #8B5A2B;
            box-shadow: 0 0 0 3px rgba(139,90,43,0.15);
        }
        button {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        .modal-content {
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative">

    <style>
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%238b5a2b' fill-opacity='0.05' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='1'/%3E%3Ccircle cx='13' cy='13' r='1'/%3E%3C/g%3E%3C/svg%3E");
            z-index: -1;
        }
    </style>

    <div class="text-center mb-6 md:mb-8">
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-primary mb-2">五子棋</h1>
        <p class="text-gray-600 text-sm sm:text-base md:text-lg">经典对弈 · 双人/人机/联机</p>
    </div>

    <!-- 登录/注册模态框 -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 overflow-y-auto">
        <div class="modal-content bg-white rounded-xl p-5 sm:p-6 md:p-8 max-w-md w-full mx-3 sm:mx-4 my-4">
            <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-6 text-center text-primary">登录五子棋</h2>
            <form id="loginForm" class="space-y-3 sm:space-y-4">
                <input type="text" id="username" placeholder="用户名" required autocomplete="username" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                <input type="password" id="password" placeholder="密码" required autocomplete="current-password" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                <div id="geetestLoginWidget" class="w-full h-12 border rounded cursor-pointer bg-gray-100 flex items-center justify-center text-sm text-gray-500"></div>
                <button type="submit" class="w-full bg-primary hover:bg-primary/90 active:bg-primary/80 text-white py-3 rounded-lg font-medium transition-colors">登录</button>
                <p class="text-center text-gray-600 text-sm sm:text-base">没有账号? <a href="#" id="showRegister" class="text-primary">立即注册</a></p>
                <p class="text-center text-gray-500 text-sm"><a href="#" id="showPasswordFreeLogin" class="text-primary hover:underline">免密登录</a></p>
            </form>
        </div>
    </div>

    <div id="registerModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden overflow-y-auto">
        <div class="modal-content bg-white rounded-xl p-5 sm:p-6 md:p-8 max-w-md w-full mx-3 sm:mx-4 my-4">
            <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-6 text-center text-primary">注册新账号</h2>
            <form id="registerForm" class="space-y-3 sm:space-y-4">
                <input type="text" id="regUsername" placeholder="用户名" required autocomplete="username" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                <input type="password" id="regPassword" placeholder="密码(至少6位)" required autocomplete="new-password" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                <input type="password" id="confirmPassword" placeholder="确认密码" required autocomplete="new-password" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                <div id="geetestRegisterWidget" class="w-full h-12 border rounded cursor-pointer bg-gray-100 flex items-center justify-center text-sm text-gray-500"></div>
                <button type="submit" class="w-full bg-primary hover:bg-primary/90 active:bg-primary/80 text-white py-3 rounded-lg font-medium transition-colors">注册</button>
                <p class="text-center text-gray-600 text-sm sm:text-base">已有账号? <a href="#" id="showLogin" class="text-primary">立即登录</a></p>
            </form>
        </div>
    </div>

    <!-- 免密登录 -->
    <div id="passwordFreeLoginPage" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden overflow-y-auto">
        <div class="modal-content bg-white rounded-xl p-5 sm:p-6 md:p-8 max-w-md w-full mx-3 sm:mx-4 my-4">
            <h2 class="text-xl sm:text-2xl font-bold mb-2 text-center text-primary">免密登录</h2>
            <p class="text-center text-gray-400 text-xs mb-4 sm:mb-6">需管理员开启免密权限后方可使用</p>
            <form id="passwordFreeLoginForm" class="space-y-3 sm:space-y-4">
                <div>
                    <input type="text" id="passwordFreeUsername" placeholder="请输入用户名" required autocomplete="username" class="w-full px-4 py-2.5 sm:py-2 border rounded-lg text-base">
                </div>
                <div id="passwordFreeAttemptsInfo" class="hidden text-center text-sm text-gray-600 bg-gray-100 rounded-lg p-2">
                    <span id="passwordFreeAttemptsText"></span>
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-primary/90 active:bg-primary/80 text-white py-3 rounded-lg font-medium transition-colors">免密登录</button>
                <div class="text-center space-y-2">
                    <p class="text-gray-600 text-sm sm:text-base">普通登录? <a href="#" id="showLoginFromFree" class="text-primary hover:underline font-medium">立即登录</a></p>
                    <p class="text-gray-500 text-sm">没有账号? <a href="#" id="showRegisterFromFree" class="text-primary hover:underline">立即注册</a></p>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-4 left-1/2 z-50" style="transform: translateX(-50%); -webkit-transform: translateX(-50%);"></div>

    <script src="/static/js/gomoku/core.js"></script>
    <script src="/static/js/gomoku/utils.js"></script>
    <script src="/static/js/gomoku/captcha.js"></script>
    <script src="/static/js/gomoku/user.js"></script>
    <script src="/static/js/gomoku/init_login.js"></script>
</body>
</html>
