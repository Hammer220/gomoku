<div id="historyContent" class="content-panel hidden">
    <h2 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> 游戏记录</h2>
    <div class="section-block">
        <div class="filter-bar">
            <div class="filter-group">
                <label class="filter-label">游戏模式</label>
                <select id="historyModeFilter" class="form-select">
                    <option value="all">全部模式</option>
                    <option value="ai">人机对战</option>
                    <option value="pvp">双人对战</option>
                    <option value="online">联机对战</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">用户</label>
                <select id="historyUserFilter" class="form-select">
                    <option value="self">自己</option>
                    <option value="all">所有人</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">结果</label>
                <select id="historyResultFilter" class="form-select">
                    <option value="all">全部结果</option>
                    <option value="win">胜利</option>
                    <option value="lose">失败</option>
                    <option value="draw">平局</option>
                </select>
            </div>
            <button id="refreshHistoryBtn" class="btn-info btn-sm">
                <i class="fa-solid fa-refresh mr-1"></i>刷新
            </button>
        </div>
        <div class="table-responsive">
            <table class="data-table data-table-striped min-w-full">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>模式</th>
                        <th>对手</th>
                        <th>结果</th>
                        <th>积分变化</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            </table>
            <div id="historyEmpty" class="empty-state hidden">
                <i class="fa-solid fa-inbox"></i>
                <p>暂无游戏记录</p>
            </div>
        </div>
        <div id="historyPagination" class="flex justify-between items-center mt-4 hidden">
            <button id="historyPrevPage" class="pagination-btn">上一页</button>
            <span id="historyPageInfo" class="text-sm text-gray-600"></span>
            <button id="historyNextPage" class="pagination-btn">下一页</button>
        </div>
    </div>
</div>
