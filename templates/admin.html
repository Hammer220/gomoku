<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - 管理后台</title>
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .bg-primary { background-color: #8B5A2B; }
        .text-primary { color: #8B5A2B; }
        .border-primary { border-color: #8B5A2B; }
        .tab-active { border-bottom: 3px solid #8B5A2B; color: #8B5A2B; font-weight: 600; }
        .toast { animation: fadeIn 0.3s, fadeOut 0.3s 2.7s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; } }
        .btn-hover { transition: all 0.2s ease; }
        .btn-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .bg-board {
            background-color: #E6C8A0;
            background-image: none;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .board-grid {
            background-size: 100% 100%;
            background-image: linear-gradient(to right, rgba(0,0,0,0.6) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0,0,0,0.6) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans bg-gradient-to-br from-[#f8f0e3] via-[#e8d3b8] to-[#d4b88e] bg-fixed relative">

    <style>
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%238b5a2b' fill-opacity='0.05' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='1'/%3E%3Ccircle cx='13' cy='13' r='1'/%3E%3C/g%3E%3C/svg%3E");
            z-index: -1;
        }
    </style>

    <div id="gameContainer" class="max-w-7xl w-full bg-white rounded-2xl shadow-xl overflow-hidden relative">
        <div class="bg-primary text-white p-4 md:p-6 flex flex-wrap justify-between items-center">
            <div><h1 class="text-2xl md:text-3xl font-bold">五子棋</h1><p class="text-sm opacity-80">管理后台</p></div>
            <div class="flex items-center space-x-3 md:space-x-6">
                <div class="flex items-center"><i class="fa-solid fa-user-circle text-2xl mr-2"></i><div><p id="userNameDisplay" class="font-semibold"></p><p class="text-xs">管理员</p></div></div>
                <button id="logoutBtn" class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg"><i class="fa-solid fa-right-from-bracket"></i> 退出</button>
            </div>
        </div>

        <div class="bg-gray-50 border-b flex overflow-x-auto">
            <a href="/game" class="px-4 md:px-6 py-3 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap">游戏大厅</a>
            <a href="/user" class="px-4 md:px-6 py-3 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap">个人中心</a>
            <a href="/messages" class="px-4 md:px-6 py-3 font-medium text-gray-600 hover:text-gray-900 whitespace-nowrap">消息中心 <span id="unreadBadge" class="bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 ml-1 hidden">0</span></a>
            <span class="tab-active px-4 md:px-6 py-3 font-medium text-red-600 whitespace-nowrap">管理后台</span>
        </div>

        {% include 'includes/admin.html' %}

        <div class="bg-gray-50 p-3 text-center text-sm text-gray-500 border-t">&copy; 2026 五子棋 · 实时状态同步版</div>
    </div>

    {% include 'includes/components.html' %}

    {% include 'includes/modals.html' %}

    <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50"></div>

    <script src="/static/js/gomoku/core.js"></script>
    <script src="/static/js/gomoku/utils.js"></script>
    <script src="/static/js/gomoku/board_render.js"></script>
<script src="/static/js/gomoku/board_rules.js"></script>
    <script src="/static/js/gomoku/game_core.js"></script>
<script src="/static/js/gomoku/game_ui.js"></script>
    <script src="/static/js/gomoku/user.js"></script>
    <script src="/static/js/gomoku/messages.js"></script>
    <script src="/static/js/gomoku/user_management/pagination.js"></script>
<script src="/static/js/gomoku/user_management/users.js"></script>
<script src="/static/js/gomoku/user_management/modals.js"></script>
<script src="/static/js/gomoku/user_management/records_admin.js"></script>
<script src="/static/js/gomoku/user_management.js"></script>
    <script src="/static/js/gomoku/match_monitor.js"></script>
    <script src="/static/js/gomoku/history_stats.js"></script>
    <script src="/static/js/gomoku/replay_canvas.js"></script>
<script src="/static/js/gomoku/replay_controls.js"></script>
    <script src="/static/js/gomoku/background_settings.js"></script>
    <script src="/static/js/gomoku/init_admin.js"></script>
</body>
</html>
